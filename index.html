<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Patia V1.5.4</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Inter,Arial;background:#0f172a;color:#e2e8f0;margin:0;padding-bottom:110px}
.modulo{display:none;padding:12px}.activo{display:block!important}
.card{background:#1e293b;padding:14px;margin:10px 0;border-radius:16px;border:1px solid #334155}
.precio{color:#facc15;font-size:22px;font-weight:900}
.stock{color:#4ade80;background:#14532d;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
input,button,select{font-size:16px;padding:14px;border-radius:12px;border:1px solid #334155;width:100%;margin:6px 0;box-sizing:border-box;background:#1e293b;color:#fff}
.btn-verde{background:#22c55e;color:#000;font-weight:900;border:none}
.btn-amarillo{background:#facc15;color:#000;font-weight:900;border:none}
.btn-azul{background:#3b82f6;color:#fff;border:none}
.btn-flotante{position:fixed;bottom:90px;right:16px;background:#facc15;color:#000;border-radius:50px;padding:16px 22px;z-index:90;font-weight:900;width:auto}
.btn-flotante2{position:fixed;bottom:155px;right:16px;background:#fb923c;color:#000;border-radius:50px;padding:16px 22px;z-index:90;font-weight:900;width:auto}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:#1e293b;border-top:2px solid #facc15;z-index:80}
#nav button{flex:1;min-width:60px;border:none;background:none;padding:10px 2px;font-size:10px;font-weight:800;color:#94a3b8}
#nav button.activo-nav{color:#facc15}
#reader-venta,#reader-inv{width:100%;border-radius:12px;overflow:hidden;background:#000;position:relative}
.btn-linterna{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#0008;color:#fff;border:1px solid #fff;padding:8px 16px;border-radius:20px;width:auto;z-index:20;font-size:13px}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:28px">
<h1 style="color:#facc15;text-align:center;margin:0;font-size:32px">TIENDA PATÍA</h1>
<p style="color:#94a3b8;text-align:center">V1.5.4 • LINTERNA</p>
<p id="txt-claves" style="color:#64748b;text-align:center;font-size:11px"></p>
<input id="login-pass" type="password" placeholder="Clave" style="font-size:28px;text-align:center;border:2px solid #facc15">
<button class="btn-verde" onclick="login()">ENTRAR</button>
</div>
<div id="mod-vender" class="modulo">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="rol-label" style="background:#facc15;color:#000;padding:6px 12px;border-radius:20px;font-size:12px">ROL:JEFE</b><span id="consecutivo" style="background:#3b82f6;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900">POS:0001</span><button onclick="logout()" style="width:auto;background:#ef4444;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:900">Salir</button></div>
<div style="display:flex;gap:8px;margin-top:12px"><input id="search" placeholder="🔍 Buscar..." oninput="buscarProducto(this.value)" style="border:2px solid #facc15"><button style="width:60px;background:#facc15;color:#000" onclick="toggleCam('venta')">📷</button></div>
<div style="position:relative"><div id="reader-venta" style="display:none"></div><button id="btn-linterna-venta" class="btn-linterna" style="display:none" onclick="toggleLinterna()">🔦 Linterna</button></div>
<div id="sugerencias"></div><div id="carrito"></div>
<h2 id="total" style="text-align:right;color:#facc15;font-size:32px">TOTAL: $ 0</h2>
<div style="display:flex;gap:10px"><button class="btn-amarillo" style="flex:1" onclick="abrirCobro('credito')">FIAR</button><button class="btn-verde" style="flex:2" onclick="abrirCobro('efectivo')">COBRAR</button></div>
</div>
<div id="mod-inventario" class="modulo"><h3 style="color:#facc15">📦 Inventario</h3><div id="lista-inv"></div><button class="btn-flotante" id="btn-add-prod" onclick="abrirModalInv()">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3 style="color:#facc15">👥 Fiados</h3><div id="lista-fiado"></div><button class="btn-flotante" id="btn-add-fiado" onclick="abrirModalFiado()">+ Persona</button></div>
<div id="mod-facturas" class="modulo"><h3 style="color:#facc15">🧾 Facturas</h3><input id="busca-fact" placeholder="Buscar POS..." oninput="renderFacturas()"><div id="lista-fact"></div></div>
<div id="mod-gastos" class="modulo"><h3 style="color:#fb923c">💸 Gastos y Compras</h3><div style="display:flex;gap:8px"><button onclick="verSubGastos('gastos')" id="tab-gastos" style="flex:1;background:#fb923c;color:#000;font-weight:900;padding:10px;border-radius:10px;border:none">Gastos</button><button onclick="verSubGastos('compras')" id="tab-compras" style="flex:1;background:#334155;color:#fff;padding:10px;border-radius:10px;border:none">Compras</button></div><div id="lista-gastos"></div><div id="lista-compras" style="display:none"></div><button class="btn-flotante" id="btn-add-gasto" onclick="abrirModalGasto()">+ Gasto</button><button class="btn-flotante2" id="btn-add-compra" onclick="abrirModalCompra()">+ Compra</button></div>
<div id="mod-ajustes" class="modulo"><h3 style="color:#facc15">⚙️ Ajustes</h3><div class="card"><h4 style="color:#facc15">🏪 Tienda</h4><input id="cfg-nombre" placeholder="TIENDA PATIA"><input id="cfg-tel" placeholder="Tel / NIT"><button class="btn-azul" onclick="guardarCfgTienda()">Guardar</button></div><div class="card" style="background:#1e1b4b;border:1px solid #6366f1"><h4 style="color:#a5b4fc">🔗 Multicelular - pon mismo código en los 2 celus</h4><div style="display:flex;gap:6px"><input id="cfg-store" placeholder="PATIA1" style="text-transform:uppercase"><button onclick="conectarTienda()" style="width:110px;background:#6366f1;color:#fff">Conectar</button></div><button onclick="forzarSincronizacion()" style="background:#22c55e;color:#000;font-weight:800;margin-top:6px">🔄 Sincronizar ahora</button><small id="store-status" style="display:block;margin-top:6px;color:#a5b4fc">Sin conectar</small></div><div id="panel-jefe" class="card" style="background:#422006"><h4 style="color:#facc15">🔑 Jefe</h4><input id="cfg-pass-jefe" placeholder="Nueva clave Jefe"><input id="cfg-pass-emp" placeholder="Nueva clave Empleado"><input id="cfg-margen" type="number" placeholder="% margen"><button class="btn-verde" onclick="guardarConfigJefe()">Guardar</button></div><div id="balance-mes" class="card"></div></div>

<div id="modal-inv" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:100;padding:16px;overflow:auto"><h3 style="color:#facc15">Producto</h3><div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código"><button style="width:60px" onclick="toggleCam('inv')">📷</button></div><div style="position:relative"><div id="reader-inv" style="display:none"></div><button id="btn-linterna-inv" class="btn-linterna" style="display:none" onclick="toggleLinterna()">🔦 Linterna</button></div><input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" placeholder="Costo" oninput="this.value=formatearInput(this.value)"><input id="inv-publico" placeholder="Público" oninput="this.value=formatearInput(this.value)"><input id="inv-stock" type="number" placeholder="Stock"><input id="inv-min" type="number" placeholder="Stock mínimo"><input id="inv-vence" type="date"><small style="color:#94a3b8">Vencimiento</small><button class="btn-verde" onclick="guardarProducto()" style="margin-top:10px">Guardar</button><button onclick="cerrarModalInv()" style="background:#334155">Cancelar</button></div>
<div id="modal-fiado" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:100;padding:16px;overflow:auto"><h3 style="color:#facc15">Cliente Fiado</h3><input id="fia-nombre" placeholder="Nombre completo"><input id="fia-cedula" placeholder="Cédula"><input id="fia-tel" placeholder="Tel WhatsApp"><input id="fia-codigo" placeholder="Código"><input id="fia-deuda" placeholder="Deuda inicial" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" onclick="guardarFiado()">Guardar</button><button onclick="cerrarModalFiado()" style="background:#334155">Cancelar</button></div>
<div id="modal-gasto" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:100;padding:16px"><h3>Gasto</h3><input id="gas-que" placeholder="Qué es?"><input id="gas-para" placeholder="Para qué?"><input id="gas-precio" placeholder="Valor" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" style="background:#fb923c;color:#000" onclick="guardarGasto()">Guardar</button><button onclick="cerrarModalGasto()" style="background:#334155">Cancelar</button></div>
<div id="modal-compra" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:101;padding:16px;overflow:auto"><h3 style="color:#fb923c">Compra</h3><input id="comp-empresa" placeholder="Empresa"><input id="comp-que" placeholder="Qué compraste?"><input id="comp-valor" placeholder="Valor total" oninput="this.value=formatearInput(this.value);calcSaldoCompra()"><select id="comp-pago"><option value="completo">Pagado completo</option><option value="abono">Aboné</option></select><input id="comp-abono" placeholder="Abono" oninput="this.value=formatearInput(this.value);calcSaldoCompra()" style="display:none"><div id="comp-saldo" style="font-weight:900;color:#facc15"></div><input id="comp-fecha" type="date"><button class="btn-verde" style="background:#fb923c;color:#000" onclick="guardarCompra()">Guardar</button><button onclick="cerrarModalCompra()" style="background:#334155">Cancelar</button></div>
<div id="modal-cobro" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:102;padding:16px;overflow:auto">
<h3 id="titulo-cobro" style="color:#facc15">COBRAR</h3>
<select id="metodo" onchange="cambiarModoCobro()"><option value="efectivo">Efectivo</option><option value="credito">Fiado</option><option value="transferencia">Transferencia</option></select>
<div id="box-cliente" class="card"><small id="label-cliente" style="color:#94a3b8">Cliente</small><input id="cliente-cobro" placeholder="222222 - Consumidor Final" style="border:2px solid #3b82f6;font-weight:800"><div id="preview-cliente" style="font-weight:bold;color:#60a5fa;margin-top:4px"></div></div>
<div id="box-efectivo"><input id="paga-con" placeholder="Paga con..." oninput="this.value=formatearInput(this.value);calcVueltas()"><div id="vueltas" style="font-weight:900;color:#4ade80;font-size:20px"></div></div>
<div id="box-fiado" style="display:none"><input id="abono-fiado" placeholder="ABONO INICIAL" oninput="this.value=formatearInput(this.value);calcAbonoFiado()"><div id="saldo-fiado" style="color:#facc15;font-weight:800"></div></div>
<div id="box-transfer" style="display:none"><input id="ref-transfer" placeholder="Ref transferencia"></div>
<button class="btn-verde" onclick="finalizarCobro()">GENERAR FACTURA <span id="consec-btn">POS:0001</span></button>
<div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;border:2px dashed #facc15;margin-top:10px;border-radius:12px"><br><div style="display:flex;gap:8px"><button class="btn-amarillo" style="flex:1" onclick="imprimirFacturaActual()">🖨️ Imprimir</button><button class="btn-azul" style="flex:1" onclick="compartirWA()">📲 WhatsApp</button></div></div>
<button onclick="cerrarCobro()" style="background:#334155">Cerrar</button></div>
<div id="nav"><button id="nav-vender" onclick="verMod('vender')" class="activo-nav">Vender</button><button id="nav-inv" onclick="verMod('inventario')">Inv</button><button onclick="verMod('fiado')">Fiado</button><button onclick="verMod('facturas')">Fact</button><button id="nav-gastos" onclick="verMod('gastos')">Gastos</button><button id="nav-ajustes" onclick="verMod('ajustes')">Ajustes</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAHGzYL9ZLiZqUgP7JrtqCndJebuSDWh3g",authDomain:"tienda-patia-v2.firebaseapp.com",databaseURL:"https://tienda-patia-v2-default-rtdb.firebaseio.com",projectId:"tienda-patia-v2",storageBucket:"tienda-patia-v2.firebasestorage.app",messagingSenderId:"318384915612",appId:"1:318384915612:web:7d15b36f6065e2bb645959"};firebase.initializeApp(firebaseConfig);const rtdb=firebase.database();
function safeGet(k,d){try{let v=localStorage.getItem(k);if(!v)return d;return JSON.parse(v);}catch(e){return d;}}
let _old=safeGet('pos_config',{pass_jefe:"1234",pass_empleado:"0000",margen_empleado:20,storeCode:"",consec:1});
let config={pass_jefe:String(_old.pass_jefe||"1234").trim(),pass_empleado:String(_old.pass_empleado||"0000").trim(),margen_empleado:Number(_old.margen_empleado||20),storeCode:(_old.storeCode||"").toUpperCase(),consec:Number(_old.consec||1)};
let rol=null,productos=safeGet('pos_prod',[]),fiados=safeGet('pos_fiados',[{nombre:"Consumidor Final",codigo:"222222",telefono:"",cedula:"",deuda:0}]),ventas=safeGet('pos_ventas',[]),gastos=safeGet('pos_gastos',[]),compras=safeGet('pos_compras',[]),carrito=[],html5QrCode=null,camAbierta=false,linternaOn=false,videoTrack=null,editIndex=-1,isSyncing=false,ultimaFactura=null,subGastos='gastos';
const $=id=>document.getElementById(id);const fmt=n=>"$ "+(Number(n)||0).toLocaleString('es-CO');const toNum=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
function formatearInput(v){let n=toNum(v);if(!n)return"";return n.toLocaleString('es-CO');}
function genConsec(){return "POS:"+String(config.consec).padStart(4,'0');}
$('txt-claves').innerText="Jefe:"+config.pass_jefe+" / Emp:"+config.pass_empleado;
function actualizarConsec(){if($('consecutivo'))$('consecutivo').innerText=genConsec();if($('consec-btn'))$('consec-btn').innerText=genConsec();}
actualizarConsec();
function login(){let p=($('login-pass').value||'').trim();if(p===config.pass_jefe)rol='jefe';else if(p===config.pass_empleado)rol='empleado';else{alert("Mala");return;}$('login-screen').style.display='none';aplicarRol();}
function logout(){rol=null;$('login-screen').style.display='flex';}
function aplicarRol(){let esJefe=rol==='jefe';$('nav-inv').style.display=esJefe?'':'none';$('nav-ajustes').style.display=esJefe?'':'none';$('nav-gastos').style.display=esJefe?'':'none';$('btn-add-prod').style.display=esJefe?'':'none';$('btn-add-fiado').style.display=esJefe?'':'none';$('btn-add-gasto').style.display=esJefe?'':'none';$('btn-add-compra').style.display=esJefe?'':'none';let pj=$('panel-jefe');if(pj)pj.style.display=esJefe?'block':'none';let bm=$('balance-mes');if(bm)bm.style.display=esJefe?'block':'none';$('rol-label').innerText=esJefe?'ROL:JEFE':'ROL:EMPLEADO';$('rol-label').style.background=esJefe?'#facc15':'#60a5fa';verMod('vender');}
function verMod(m){if(rol==='empleado'&&['inventario','ajustes','gastos'].includes(m)){alert('Solo Jefe');m='vender';}document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo'));let mod=$('mod-'+m);if(mod)mod.classList.add('activo');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('activo-nav'));let nb=$('nav-'+m);if(nb)nb.classList.add('activo-nav');if(m==='inventario')renderInv();if(m==='fiado')renderFiado();if(m==='facturas')renderFacturas();if(m==='gastos')verSubGastos(subGastos);if(m==='ajustes')renderBalance();}
function saveAll(){localStorage.setItem('pos_prod',JSON.stringify(productos));localStorage.setItem('pos_fiados',JSON.stringify(fiados));localStorage.setItem('pos_ventas',JSON.stringify(ventas));localStorage.setItem('pos_gastos',JSON.stringify(gastos));localStorage.setItem('pos_compras',JSON.stringify(compras));localStorage.setItem('pos_config',JSON.stringify(config));localStorage.setItem('tienda_nombre',$('cfg-nombre').value);localStorage.setItem('tienda_tel',$('cfg-tel').value);if(config.storeCode){let data={productos,fiados,ventas,gastos,compras,config,ultSync:Date.now()};rtdb.ref('tiendas/'+config.storeCode).set(data).then(()=>{$('store-status').innerText='Subido ✅ '+new Date().toLocaleTimeString();}).catch(e=>{$('store-status').innerText='Error subida: '+e.message;});}}
function conectarTienda(){let code=$('cfg-store').value.trim().toUpperCase();if(code.length<3){alert('Pon código ej PATIA1');return;}config.storeCode=code;localStorage.setItem('pos_config',JSON.stringify(config));$('store-status').innerText='Conectando a '+code+'...';rtdb.ref('tiendas/'+code).on('value',snap=>{let c=snap.val();if(!c){$('store-status').innerText='No existe '+code+', se creará al guardar';return;}try{if(c.productos)productos=c.productos;if(c.fiados)fiados=c.fiados;if(c.ventas)ventas=c.ventas;if(c.gastos)gastos=c.gastos;if(c.compras)compras=c.compras;if(c.config && c.config.consec)config.consec=Math.max(config.consec,c.config.consec);localStorage.setItem('pos_prod',JSON.stringify(productos));localStorage.setItem('pos_fiados',JSON.stringify(fiados));localStorage.setItem('pos_ventas',JSON.stringify(ventas));localStorage.setItem('pos_gastos',JSON.stringify(gastos));localStorage.setItem('pos_compras',JSON.stringify(compras));localStorage.setItem('pos_config',JSON.stringify(config));actualizarConsec();renderAll();$('store-status').innerText='Sincronizado '+code+' ✅ '+new Date().toLocaleTimeString()+' | Prods:'+productos.length;}catch(e){$('store-status').innerText='Error sync: '+e.message;}},err=>{$('store-status').innerText='Error Firebase: '+err.message;});}
function forzarSincronizacion(){if(!config.storeCode){alert('Pon código primero');return;}$('store-status').innerText='Forzando subida...';saveAll();}
if(config.storeCode){$('cfg-store').value=config.storeCode;conectarTienda();}
function renderAll(){renderInv();renderFiado();renderFacturas();renderGastos();renderCompras();renderBalance();}
async function toggleCam(t){let id=t==='venta'?'reader-venta':'reader-inv';let el=$(id);let btnL=$('btn-linterna-'+t);if(camAbierta){try{await html5QrCode.stop();}catch(e){}el.style.display='none';if(btnL)btnL.style.display='none';camAbierta=false;linternaOn=false;videoTrack=null;return;}el.style.display='block';html5QrCode=new Html5Qrcode(id);camAbierta=true;try{await html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:100}},d=>{if(t==='venta')buscarProducto(d,true);else $('inv-codigo').value=d;toggleCam(t);});setTimeout(()=>{try{let videoEl=document.querySelector('#'+id+' video');if(videoEl && videoEl.srcObject){let tracks=videoEl.srcObject.getVideoTracks();if(tracks.length>0){videoTrack=tracks[0];let caps=videoTrack.getCapabilities();if(caps.torch){if(btnL)btnL.style.display='block';}else{if(btnL)btnL.style.display='none';}}}}catch(e){}},800);}catch(e){camAbierta=false;alert('No se pudo abrir cámara: '+e);}}
async function toggleLinterna(){if(!videoTrack){alert('Cámara no activa');return;}try{linternaOn=!linternaOn;await videoTrack.applyConstraints({advanced:[{torch:linternaOn}]});let btns=document.querySelectorAll('.btn-linterna');btns.forEach(b=>b.innerText=linternaOn?'🔦 Linterna OFF':'🔦 Linterna ON');}catch(e){alert('Tu celular no permite linterna en navegador: '+e.message);}}
function verSubGastos(t){subGastos=t;$('lista-gastos').style.display=t==='gastos'?'block':'none';$('lista-compras').style.display=t==='compras'?'block':'none';$('tab-gastos').style.background=t==='gastos'?'#fb923c':'#334155';$('tab-compras').style.background=t==='compras'?'#fb923c':'#334155';}
function cambiarModoCobro(){let m=$('metodo').value;$('box-efectivo').style.display=m==='efectivo'?'block':'none';$('box-fiado').style.display=m==='credito'?'block':'none';$('box-transfer').style.display=m==='transferencia'?'block':'none';}
function calcAbonoFiado(){let total=carrito.reduce((s,p)=>s+p.precio_final*(p.cant||1),0);let abono=toNum($('abono-fiado').value);$('saldo-fiado').innerText=abono?`Total: ${fmt(total)} | Abono: ${fmt(abono)} | Saldo: ${fmt(total-abono)}`:`Total a fiar: ${fmt(total)}`;}
  function buscarProducto(txt,esCod){if(!txt){$('sugerencias').innerHTML='';return;}let res=productos.filter(p=>esCod?p.codigo===txt:p.nombre.toLowerCase().includes(txt.toLowerCase()));if(esCod&&res[0]){addCarrito(res[0]);$('search').value='';$('sugerencias').innerHTML='';return;}$('sugerencias').innerHTML=res.slice(0,6).map(r=>`<div class="card" onclick="addCarrito(productos.find(p=>p.codigo==='${r.codigo}'))"><b>${r.nombre}</b><br><span class="precio">${fmt(r.publico)}</span> <small class="stock">Quedan ${r.stock} u</small></div>`).join('');}
function addCarrito(p){let ex=carrito.find(x=>x.codigo===p.codigo);if(ex)ex.cant++;else carrito.push({...p,cant:1,precio_final:p.publico});renderCarrito();}
function renderCarrito(){let tot=0;$('carrito').innerHTML=carrito.map((c,i)=>{let sub=c.precio_final*(c.cant||1);tot+=sub;return `<div class="card"><b>${c.nombre}</b> x${c.cant}<br><div style=display:flex;gap:8px><button style=width:40px;background:#334155 onclick="carrito[${i}].cant=Math.max(1,carrito[${i}].cant-1);renderCarrito()">-</button><input value="${fmt(c.precio_final).replace('$ ','')}" oninput="carrito[${i}].precio_final=toNum(this.value);renderCarrito()" style=width:50%;text-align:center;color:#facc15;font-weight:900><button style=width:40px;background:#334155 onclick="carrito[${i}].cant++;renderCarrito()">+</button><button onclick="carrito.splice(${i},1);renderCarrito()" style=width:50px;background:#7f1d1d">X</button></div><small style=color:#facc15>${fmt(sub)}</small></div>`;}).join('');$('total').innerText="TOTAL: "+fmt(tot);calcAbonoFiado();}
function calcVueltas(){let paga=toNum($('paga-con').value);let tot=carrito.reduce((s,p)=>s+p.precio_final*(p.cant||1),0);$('vueltas').innerText=paga? (paga-tot>=0?"Vueltas: "+fmt(paga-tot):"Falta: "+fmt(Math.abs(paga-tot))):"";}
function abrirModalInv(i=-1){if(rol!=='jefe'){alert('Solo Jefe');return;}editIndex=i;$('modal-inv').style.display='block';if(i>=0){let p=productos[i];$('inv-codigo').value=p.codigo;$('inv-nombre').value=p.nombre;$('inv-costo').value=fmt(p.costo).replace('$ ','');$('inv-publico').value=fmt(p.publico).replace('$ ','');$('inv-stock').value=p.stock;$('inv-min').value=p.min||3;$('inv-vence').value=p.vence||'';}else{$('inv-codigo').value='';$('inv-nombre').value='';$('inv-costo').value='';$('inv-publico').value='';$('inv-stock').value='';$('inv-min').value='3';$('inv-vence').value='';}}function cerrarModalInv(){$('modal-inv').style.display='none';}
function guardarProducto(){if(rol!=='jefe'){alert('Solo Jefe');return;}let o={codigo:$('inv-codigo').value.trim(),nombre:$('inv-nombre').value.trim(),costo:toNum($('inv-costo').value),publico:toNum($('inv-publico').value),stock:Number($('inv-stock').value||0),min:Number($('inv-min').value||3),vence:$('inv-vence').value||''};if(!o.codigo||!o.nombre)return;if(editIndex>=0)productos[editIndex]={...productos[editIndex],...o};else productos.push(o);saveAll();cerrarModalInv();renderInv();}
function renderInv(){let h=productos.map((p,i)=>`<div class="card"><b>${p.nombre}</b><br><span class="precio">${fmt(p.publico)}</span> <span class="stock">Stock:${p.stock}</span><br><small>${p.codigo}</small><br>${rol==='jefe'?`<span onclick="abrirModalInv(${i})" style="color:#60a5fa">✏️ Editar</span>`:''}</div>`).join('');$('lista-inv').innerHTML=h||'Vacío';}
function abrirModalFiado(i=-1){if(rol!=='jefe' && i>=0){alert('Solo Jefe');return;}if(rol!=='jefe' && i==-1){alert('Solo Jefe');return;}if(i>=0){let f=fiados[i];$('fia-nombre').value=f.nombre;$('fia-cedula').value=f.cedula||'';$('fia-tel').value=f.telefono||'';$('fia-codigo').value=f.codigo;$('fia-deuda').value=fmt(f.deuda).replace('$ ','');editIndex=i;}else{editIndex=-1;$('fia-nombre').value='';$('fia-cedula').value='';$('fia-tel').value='';$('fia-codigo').value='';$('fia-deuda').value='';}$('modal-fiado').style.display='block';}function cerrarModalFiado(){$('modal-fiado').style.display='none';}
function guardarFiado(){if(rol!=='jefe'){alert('Solo Jefe');return;}let n=$('fia-nombre').value.trim();if(!n)return;let obj={nombre:n,cedula:$('fia-cedula').value.trim(),telefono:$('fia-tel').value.trim(),codigo:($('fia-codigo').value.trim()||n.slice(0,4).toUpperCase()),deuda:toNum($('fia-deuda').value)};if(editIndex>=0)fiados[editIndex]=obj;else fiados.push(obj);saveAll();cerrarModalFiado();renderFiado();}
function renderFiado(){let esJefe=rol==='jefe';$('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b style="color:#facc15">${f.nombre}</b> (${f.codigo})<br><small>Céd: ${f.cedula||'-'} | Tel: ${f.telefono||'-'}</small><br>Debe: <b style="color:#f87171">${fmt(f.deuda)}</b><br><div style="display:flex;gap:6px;margin-top:6px">${esJefe?`<button onclick="abonar(${i})" style="background:#22c55e;color:#000;width:30%">Abono</button><button onclick="recordarFiado(${i})" style="background:#25D366;color:#000;width:40%">📲 Recordar</button><button onclick="abrirModalFiado(${i})" style="background:#334155;width:30%">Editar</button>`:`<small style="color:#94a3b8">Solo vista</small>`}</div></div>`).join('');}
function abonar(i){if(rol!=='jefe'){alert('Solo Jefe');return;}let m=toNum(prompt("Abono para "+fiados[i].nombre,"0")||0);if(m>0){fiados[i].deuda=Math.max(0,fiados[i].deuda-m);saveAll();renderFiado();}}
function recordarFiado(i){if(rol!=='jefe'){alert('Solo Jefe');return;}let f=fiados[i];if(!f.telefono){alert("Sin WhatsApp");return;}let tel=f.telefono.replace(/[^0-9]/g,'');if(tel.length===10)tel='57'+tel;let msg=`Hola ${f.nombre}, te escribe ${localStorage.getItem('tienda_nombre')||'TIENDA PATIA'}%0ASaldo: ${fmt(f.deuda)}`;window.open("https://wa.me/"+tel+"?text="+msg,"_blank");}
function abrirModalGasto(){if(rol!=='jefe'){alert('Solo Jefe');return;}$('modal-gasto').style.display='block';}function cerrarModalGasto(){$('modal-gasto').style.display='none';}
function guardarGasto(){if(rol!=='jefe'){alert('Solo Jefe');return;}gastos.push({que:$('gas-que').value,para:$('gas-para').value,precio:toNum($('gas-precio').value),fecha:Date.now()});saveAll();cerrarModalGasto();renderGastos();}
function renderGastos(){$('lista-gastos').innerHTML=gastos.slice().reverse().map(g=>`<div class="card"><b>${g.que}</b> - ${fmt(g.precio)}<br><small>${g.para} | ${new Date(g.fecha).toLocaleString()}</small></div>`).join('')||'Sin gastos';}
function abrirModalCompra(){if(rol!=='jefe'){alert('Solo Jefe');return;}$('modal-compra').style.display='block';$('comp-fecha').valueAsDate=new Date();}function cerrarModalCompra(){$('modal-compra').style.display='none';}
function calcSaldoCompra(){let v=toNum($('comp-valor').value);let a=toNum($('comp-abono').value);let p=$('comp-pago').value;if(p==='completo'){$('comp-abono').style.display='none';$('comp-saldo').innerText=v?"Pagado: "+fmt(v):"";}else{$('comp-abono').style.display='block';$('comp-saldo').innerText=v?`Total: ${fmt(v)} | Abono: ${fmt(a)} | Saldo: ${fmt(v-a)}`:"";}}
$('comp-pago').addEventListener('change',calcSaldoCompra);
function guardarCompra(){if(rol!=='jefe'){alert('Solo Jefe');return;}let empresa=$('comp-empresa').value.trim();let que=$('comp-que').value.trim();let valor=toNum($('comp-valor').value);if(!empresa||!que||!valor){alert("Falta");return;}let pago=$('comp-pago').value;let abono=pago==='completo'?valor:toNum($('comp-abono').value);let saldo=valor-abono;compras.push({empresa,que,valor,abono,saldo,pago,fecha:Date.now(),fechaTexto:$('comp-fecha').value||new Date().toISOString().slice(0,10)});saveAll();cerrarModalCompra();renderCompras();}
function renderCompras(){$('lista-compras').innerHTML=compras.slice().reverse().map((c,i)=>`<div class="card"><b>${c.empresa}</b> - ${fmt(c.valor)} | Saldo ${fmt(c.saldo)}<br><small>${c.que}</small></div>`).join('')||'Sin compras';}
function abrirCobro(tipo){if(!carrito.length){alert("Vacío");return;}$('metodo').value=tipo||'efectivo';cambiarModoCobro();let cli=fiados.find(f=>f.codigo==="222222")||fiados[0];if(tipo==='credito'){$('cliente-cobro').value='';}else{$('cliente-cobro').value=cli?cli.codigo+" - "+cli.nombre:"222222 - Consumidor Final";}$('modal-cobro').style.display='block';$('bloque-factura').style.display='none';calcVueltas();calcAbonoFiado();}
function cerrarCobro(){$('modal-cobro').style.display='none';}
function generarCanvasFactura(v){let c=$('canvas-factura');c.width=384;c.height=800;let ctx=c.getContext('2d');ctx.fillStyle="#fff";ctx.fillRect(0,0,384,800);ctx.fillStyle="#000";ctx.font="bold 11px monospace";let y=16;ctx.fillText("DOCUMENTO CONTROL INTERNO",10,y);y+=12;ctx.font="8px monospace";ctx.fillText("NO VALIDO COMO FACTURA ELECTRONICA DIAN",10,y);y+=14;ctx.font="bold 13px monospace";ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA PATIA').toUpperCase().slice(0,32),10,y);y+=14;ctx.font="11px monospace";ctx.fillText($('cfg-tel').value||'',10,y);y+=12;ctx.fillText(v.consec+" | "+new Date(v.fecha).toLocaleString(),10,y);y+=12;ctx.fillText("Cliente: "+(v.cliente||"").slice(0,30),10,y);y+=12;if(v.ref)ctx.fillText("Ref: "+v.ref.slice(0,30),10,y);if(v.ref)y+=12;ctx.fillText("Vigencia: "+(v.vigencia?new Date(v.vigencia).toLocaleDateString():'')+" (30d)",10,y);y+=10;ctx.fillText("--------------------------------",10,y);(v.productos||[]).forEach(p=>{y+=12;ctx.fillText((p.nombre.slice(0,20)+" x"+(p.cant||1)+" "+fmt(p.precio_final*(p.cant||1))).slice(0,36),10,y);});y+=16;ctx.font="bold 13px monospace";ctx.fillText("TOTAL: "+fmt(v.total)+" "+(v.metodo||'').toUpperCase(),10,y);y+=14;if(v.abono)ctx.fillText("Abono: "+fmt(v.abono)+" Saldo: "+fmt(v.total-v.abono),10,y);return c.toDataURL();}
function finalizarCobro(){let met=$('metodo').value;let cliTxt=$('cliente-cobro').value.trim();let cliente=null;if(met==='credito'){cliente=fiados.find(f=>cliTxt.toLowerCase().includes(f.nombre.toLowerCase())||f.codigo===cliTxt||cliTxt.includes(f.codigo));if(!cliente){alert("Escribe nombre o código cliente fiado existente");return;}}else{cliente=fiados.find(f=>cliTxt.includes(f.codigo))||fiados.find(f=>f.codigo==="222222");}let total=carrito.reduce((s,p)=>s+p.precio_final*(p.cant||1),0);let abono=met==='credito'?toNum($('abono-fiado').value):0;let ref=met==='transferencia'?$('ref-transfer').value.trim():'';if(met==='credito'){let saldo=total-abono;cliente.deuda+=saldo;}let vigencia=new Date();vigencia.setDate(vigencia.getDate()+30);let venta={total,abono,ref,fecha:Date.now(),productos:JSON.parse(JSON.stringify(carrito)),consec:genConsec(),cliente:cliente?cliente.nombre+" ("+cliente.codigo+")":cliTxt||"222222",vigencia:vigencia.toISOString(),metodo:met};ventas.push(venta);config.consec++;saveAll();actualizarConsec();$('img-factura').src=generarCanvasFactura(venta);ultimaFactura=venta;$('bloque-factura').style.display='block';carrito.forEach(v=>{let pr=productos.find(p=>p.codigo===v.codigo);if(pr)pr.stock-=v.cant||1;});saveAll();carrito=[];renderCarrito();renderFacturas();renderFiado();renderInv();}
function imprimirFacturaActual(){if(!ultimaFactura)return;let w=window.open();w.document.write('<img src="'+$('img-factura').src+'" style="width:100%" onload="window.print()">');}
function reimprimirFactura(i){let v=ventas[i];ultimaFactura=v;$('img-factura').src=generarCanvasFactura(v);$('modal-cobro').style.display='block';$('bloque-factura').style.display='block';}
function compartirWA(){if(!ultimaFactura)return;let v=ultimaFactura;let txt=`*${localStorage.getItem('tienda_nombre')||'TIENDA PATIA'}*%0A*CONTROL INTERNO*%0A${v.consec}%0ACliente: ${v.cliente}%0ATotal: ${fmt(v.total)}`;window.open("https://wa.me/?text="+txt,"_blank");}
function compartirWAFactura(i){let v=ventas[i];let txt=`*${localStorage.getItem('tienda_nombre')||'TIENDA PATIA'}*%0A${v.consec}%0ACliente: ${v.cliente}%0ATotal: ${fmt(v.total)}`;window.open("https://wa.me/?text="+txt,"_blank");}
function renderFacturas(){let q=($('busca-fact').value||'').toLowerCase();let list=ventas.map((v,i)=>({...v,idx:i})).reverse().filter(v=>!q||v.consec.toLowerCase().includes(q)||v.cliente.toLowerCase().includes(q));$('lista-fact').innerHTML=list.map(v=>`<div class="card"><b style="color:#facc15">${v.consec}</b> - ${new Date(v.fecha).toLocaleString()}<br>Cliente: ${v.cliente} - <b style="color:#4ade80">${fmt(v.total)}</b>${v.abono?'<br>Abono:'+fmt(v.abono):''}<br><div style="display:flex;gap:6px;margin-top:8px"><button onclick="reimprimirFactura(${v.idx})" style="flex:1;background:#facc15;color:#000;font-weight:800">🖨️ Imprimir</button><button onclick="compartirWAFactura(${v.idx})" style="flex:1;background:#22c55e;color:#000">📲 WhatsApp</button></div></div>`).join('')||'Sin facturas';}
function guardarCfgTienda(){saveAll();alert("Guardado ✅");}
function guardarConfigJefe(){if(rol!=='jefe'){alert('Solo Jefe');return;}if($('cfg-pass-jefe').value)config.pass_jefe=$('cfg-pass-jefe').value.trim();if($('cfg-pass-emp').value)config.pass_empleado=$('cfg-pass-emp').value.trim();if($('cfg-margen').value)config.margen_empleado=Number($('cfg-margen').value);if($('cfg-store').value)config.storeCode=$('cfg-store').value.trim().toUpperCase();saveAll();alert("Guardado");}
function renderBalance(){let mes=ventas.filter(v=>v.fecha>Date.now()-2592000000);let tot=mes.reduce((s,v)=>s+Number(v.total),0);let gMes=gastos.reduce((s,g)=>s+Number(g.precio),0);let cMes=compras.reduce((s,c)=>s+Number(c.valor),0);$('balance-mes').innerHTML=`Balance 30d<br>Ventas: ${fmt(tot)}<br>Gastos: ${fmt(gMes)}<br>Compras: ${fmt(cMes)}<br>Neto: ${fmt(tot-gMes-cMes)}`;}
$('cliente-cobro').addEventListener('input',e=>{let t=e.target.value.toLowerCase();let f=fiados.find(x=>x.nombre.toLowerCase().includes(t)||x.codigo.toLowerCase().includes(t));$('preview-cliente').innerText=f?`Encontrado: ${f.nombre} | Debe: ${fmt(f.deuda)}`:'No encontrado';});
$('cfg-nombre').value=localStorage.getItem('tienda_nombre')||'TIENDA PATIA';$('cfg-tel').value=localStorage.getItem('tienda_tel')||'';$('cfg-store').value=config.storeCode||'PATIA1';
if(!fiados.find(f=>f.codigo==="222222")){fiados.unshift({nombre:"Consumidor Final",codigo:"222222",telefono:"",cedula:"",deuda:0});saveAll();}
renderAll();verSubGastos('gastos');cambiarModoCobro();
</script>
