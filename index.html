<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Patia V1.0 Roles</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding-bottom:90px}
.modulo{display:none;padding:15px}.activo{display:block}
.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 3px #ccc;position:relative}
input,button,select{font-size:18px;padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;margin:6px 0;box-sizing:border-box}
.btn-verde{background:#22c55e;color:#fff;font-weight:bold;border:none}
.btn-azul{background:#2563eb;color:#fff;border:none}
.btn-flotante{position:fixed;bottom:75px;right:20px;background:#2563eb;color:#fff;border-radius:50px;padding:16px 22px;z-index:99;width:auto;font-weight:bold}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:50}
#nav button{flex:1;border:none;background:none;padding:14px 0}
#reader-venta,#reader-inv{width:100%;display:none;border-radius:12px;overflow:hidden}
#btn-flash-venta,#btn-flash-inv{display:none;width:100%;background:#333;color:#fff}
.lapiz{position:absolute;right:10px;top:10px;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:30px;box-sizing:border-box">
  <h1 style="color:#fff;text-align:center">POS Patía</h1>
  <p style="color:#fff;text-align:center">Jefe:1234 / Empleado:0000</p>
  <input id="login-pass" type="password" placeholder="Contraseña" style="font-size:22px;text-align:center">
  <button class="btn-verde" onclick="login()" style="font-size:22px">Entrar</button>
</div>

<!-- VENDER -->
<div id="mod-vender" class="modulo activo">
  <div style="display:flex;justify-content:space-between"><b id="rol-label"></b><button onclick="logout()" style="width:auto;background:#000;color:#fff">Salir</button></div>
  <div style="display:flex;gap:6px"><input id="search" placeholder="Buscar..." oninput="buscarProducto(this.value)"><button style="width:65px" onclick="toggleCam('venta')">📷</button></div>
  <button id="btn-flash-venta" onclick="toggleFlash()">🔦 Flash</button><div id="reader-venta"></div>
  <div id="sugerencias"></div><div id="carrito"></div>
  <h2 id="total">TOTAL: $ 0</h2>
  <button class="btn-verde" onclick="abrirCobro()">COBRAR</button>
  <button onclick="cuadreCaja()" style="background:#e5e7eb">📊 CUADRE DIARIO</button>
</div>

<div id="mod-inventario" class="modulo"><h3>Inventario</h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv()">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3>Fiados</h3><div id="lista-fiado"></div><button class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>

<div id="mod-ajustes" class="modulo">
  <h3>Ajustes Tienda</h3>
  <input id="cfg-nombre" placeholder="Nombre tienda"><input id="cfg-tel" placeholder="Teléfono"><button class="btn-azul" onclick="guardarCfgTienda()">Guardar Tienda</button>
  <hr>
  <div id="panel-jefe" class="card" style="background:#fef3c7">
    <h4>🔑 Control Jefe (solo jefe)</h4>
    <input id="cfg-pass-jefe" placeholder="Nueva clave Jefe">
    <input id="cfg-pass-emp" placeholder="Nueva clave Empleado">
    <input id="cfg-margen" type="number" placeholder="% ganancia mínima empleado ej:20">
    <input id="cfg-limite" type="number" placeholder="Límite deuda bloqueo empleado ej:50000">
    <button class="btn-verde" onclick="guardarConfigJefe()">Guardar Config Jefe</button>
  </div>
  <div id="bloque-balance">
    <h3>Balance 30 días</h3><div id="balance-mes" class="card"></div>
    <h3>Top 3</h3><div id="top3" class="card"></div>
  </div>
</div>

<!-- MODALES -->
<div id="modal-inv" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:100;padding:20px;overflow:auto">
  <h3 id="titulo-inv">Producto</h3>
  <div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código"><button style="width:65px" onclick="toggleCam('inv')">📷</button></div>
  <button id="btn-flash-inv" onclick="toggleFlash()">🔦</button><div id="reader-inv"></div>
  <input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" type="number" placeholder="Costo"><input id="inv-publico" type="number" placeholder="Público"><input id="inv-stock" type="number" placeholder="Stock">
  <button class="btn-verde" onclick="guardarProducto()">Guardar</button><button onclick="cerrarModalInv()">Salir</button>
</div>

<div id="modal-fiado" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:100;padding:20px">
  <input id="fia-nombre" placeholder="Nombre"><input id="fia-tel" placeholder="Tel"><input id="fia-codigo" placeholder="Código"><input id="fia-deuda" type="number" value="0">
  <button class="btn-verde" onclick="guardarFiado()">Guardar</button><button onclick="cerrarModalFiado()">Salir</button>
</div>

<div id="modal-cobro" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:101;padding:20px;overflow:auto">
  <select id="metodo"><option value="efectivo">Efectivo</option><option value="credito">Fiado</option><option value="transferencia">Transferencia</option></select>
  <input id="cliente-cobro" placeholder="Nombre o código fiado"><div id="preview-cliente" style="font-weight:bold;color:#2563eb"></div>
  <button class="btn-verde" onclick="finalizarCobro()">Generar Factura</button>
  <div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;margin-top:12px;border:1px dashed #000"><button class="btn-azul" onclick="compartirWhatsapp()">WhatsApp (Imagen)</button></div>
  <button onclick="cerrarCobro()" style="background:#eee">Cerrar</button>
</div>

<div id="nav"><button onclick="verMod('vender')">Vender</button><button id="btn-nav-inv" onclick="verMod('inventario')">Inventario</button><button onclick="verMod('fiado')">Fiado</button><button id="btn-nav-ajustes" onclick="verMod('ajustes')">Ajustes</button></div>

<script>
let config=JSON.parse(localStorage.getItem('pos_config')||'{"pass_jefe":"1234","pass_empleado":"0000","margen_empleado":20,"limite_fiado":50000}');
let rol=null; let productos=JSON.parse(localStorage.getItem('pos_prod')||'[]'); let fiados=JSON.parse(localStorage.getItem('pos_fiados')||'[]'); let ventas=JSON.parse(localStorage.getItem('pos_ventas')||'[]');
let carrito=[]; let html5QrCode=null; let camAbierta=false; let editIndex=-1;
const fmt=n=>"$ "+Number(n||0).toLocaleString('es-CO'); const $=id=>document.getElementById(id);

function login(){
  let p=$('login-pass').value.trim();
  if(p===config.pass_jefe) rol='jefe'; else if(p===config.pass_empleado) rol='empleado'; else {alert("Clave mala");return;}
  $('login-screen').style.display='none'; $('rol-label').innerText="ROL: "+rol.toUpperCase(); aplicarRol();
}
function aplicarRol(){
  if(rol==='empleado'){
    $('btn-nav-inv').style.display='none'; $('btn-nav-ajustes').style.display='none';
    $('panel-jefe').style.display='none'; $('bloque-balance').style.display='none';
  } else {
    $('btn-nav-inv').style.display=''; $('btn-nav-ajustes').style.display=''; $('panel-jefe').style.display='block'; $('bloque-balance').style.display='block';
  } verMod('vender');
}
function logout(){ rol=null; $('login-screen').style.display='flex'; $('login-pass').value=''; }

async function toggleCam(tipo){
  const idR=tipo==='venta'?'reader-venta':'reader-inv'; const idF=tipo==='venta'?'btn-flash-venta':'btn-flash-inv'; const elR=$(idR); const elF=$(idF);
  if(camAbierta){try{await html5QrCode.stop();html5QrCode.clear();}catch(e){} elR.style.display='none';elF.style.display='none';camAbierta=false;return;}
  elR.style.display='block';elF.style.display='block'; html5QrCode=new Html5Qrcode(idR); camAbierta=true;
  html5QrCode.start({facingMode:"environment"},{fps:15,qrbox:{width:280,height:100},experimentalFeatures:{useBarCodeDetectorIfSupported:true},formatsToSupport:[0,1,2,3,9]},(dec)=>{
    if(tipo==='venta') buscarProducto(dec,true); else $('inv-codigo').value=dec; toggleCam(tipo);
  }).catch(e=>{camAbierta=false;});
}
function toggleFlash(){ try{html5QrCode.getRunningTrackCameraCapabilities().torchFeature().apply(true);}catch(e){} }

function buscarProducto(txt,esCod=false){
  if(!txt){$('sugerencias').innerHTML='';return;}
  let res=productos.filter(p=>esCod? p.codigo==txt : p.nombre.toLowerCase().includes(txt.toLowerCase())||p.codigo.includes(txt));
  if(esCod&&res[0]){addCarrito(res[0]); $('search').value=''; $('sugerencias').innerHTML='';}
  else{$('sugerencias').innerHTML=res.slice(0,5).map(r=>`<div class="card" onclick="addCarrito(productos.find(p=>p.codigo=='${r.codigo}'))">${r.nombre} - ${fmt(r.publico)} - Stock:${r.stock}</div>`).join('');}
}
function addCarrito(p){ carrito.push({...p,precio_final:p.publico}); renderCarrito(); }
function renderCarrito(){
  let tot=0; $('carrito').innerHTML=carrito.map((c,i)=>{
    tot+=Number(c.precio_final);
    let precioMinimo=Number(c.costo)+(Number(c.costo)*config.margen_empleado/100);
    let info = rol==='jefe'? `<small>Costo:${fmt(c.costo)} | Min:${fmt(precioMinimo)} | Stock:${c.stock}</small>` : `<small>Stock:${c.stock} | Min:${fmt(precioMinimo)}</small>`;
    return `<div class="card"><b>${c.nombre}</b> ${info}<br><input type="number" value="${c.precio_final}" onchange="validarPrecio(${i},this.value)" style="width:130px"> ${fmt(c.precio_final)} <button onclick="carrito.splice(${i},1);renderCarrito()" style="width:auto;background:#fee">X</button></div>`;
  }).join(''); $('total').innerText="TOTAL: "+fmt(tot);
}
function validarPrecio(i,val){
  let prod=carrito[i]; let minimo=Number(prod.costo)+(Number(prod.costo)*config.margen_empleado/100);
  if(rol==='empleado' && Number(val) < minimo){ alert("No puedes bajar de "+fmt(minimo)+" - Margen "+config.margen_empleado+"%"); carrito[i].precio_final=minimo; } else { carrito[i].precio_final=Number(val); }
  renderCarrito();
}

function verMod(m){
  try{html5QrCode?.stop();}catch(e){} document.querySelectorAll('[id^="reader-"]').forEach(e=>e.style.display='none'); document.querySelectorAll('[id^="btn-flash"]').forEach(e=>e.style.display='none'); camAbierta=false;
  document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo')); $('mod-'+m).classList.add('activo');
  if(m=='inventario'&&rol==='jefe') renderInv(); if(m=='fiado') renderFiado(); if(m=='ajustes') renderBalance();
}
function abrirModalInv(i=-1){ if(rol!=='jefe'){alert("Solo jefe");return;} editIndex=i; $('modal-inv').style.display='block'; if(i>=0){let p=productos[i]; $('inv-codigo').value=p.codigo;$('inv-nombre').value=p.nombre;$('inv-costo').value=p.costo;$('inv-publico').value=p.publico;$('inv-stock').value=p.stock;} else {$('inv-codigo').value='';$('inv-nombre').value='';$('inv-costo').value='';$('inv-publico').value='';$('inv-stock').value='';}}
function cerrarModalInv(){ $('modal-inv').style.display='none'; editIndex=-1; }
function guardarProducto(){ let o={codigo:$('inv-codigo').value.trim(),nombre:$('inv-nombre').value.trim(),costo:Number($('inv-costo').value||0),publico:Number($('inv-publico').value||0),stock:Number($('inv-stock').value||0)}; if(!o.codigo||!o.nombre){alert("Falta");return;} if(editIndex>=0) productos[editIndex]=o; else productos.push(o); localStorage.setItem('pos_prod',JSON.stringify(productos)); cerrarModalInv(); renderInv(); }
function renderInv(){ $('lista-inv').innerHTML=productos.map((p,i)=>`<div class="card"><b>${p.nombre}</b><br>${fmt(p.publico)} - Stock:${p.stock}<br><small>${p.codigo} | Costo:${fmt(p.costo)}</small><span class="lapiz" onclick="abrirModalInv(${i})">✏️</span></div>`).join('')||'Vacío'; }

function abrirModalFiado(){ $('modal-fiado').style.display='block'; }
function cerrarModalFiado(){ $('modal-fiado').style.display='none'; }
function guardarFiado(){ let n=$('fia-nombre').value.trim(); if(!n){alert("Falta nombre");return;} fiados.push({nombre:n,telefono:$('fia-tel').value,codigo:$('fia-codigo').value.trim()||n.slice(0,2).toUpperCase(),deuda:Number($('fia-deuda').value||0),historial:[]}); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); cerrarModalFiado(); renderFiado(); }
function renderFiado(){ $('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b>${f.nombre}</b> (${f.codigo})<br>Debe: ${fmt(f.deuda)}<br><button onclick="abonar(${i})" style="width:48%">Abono</button><button onclick="verCuenta(${i})" style="width:48%">Cuenta</button></div>`).join('')||'Sin fiados'; }
function abonar(i){ let m=Number(prompt("Abono?")||0); if(m>0){fiados[i].deuda-=m; fiados[i].historial.push({tipo:'abono',monto:m,fecha:Date.now()}); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); renderFiado();}}
function verCuenta(i){ alert(JSON.stringify(fiados[i],null,2)); }

function abrirCobro(){ if(carrito.length==0){alert("Vacio");return;} $('modal-cobro').style.display='block'; $('bloque-factura').style.display='none'; }
function cerrarCobro(){ $('modal-cobro').style.display='none'; }
function finalizarCobro(){
  const metodo=$('metodo').value; const cli=$('cliente-cobro').value.trim(); let cliObj=null;
  if(metodo==='credito'&&cli){
    cliObj=fiados.find(f=>f.codigo.toLowerCase()==cli.toLowerCase()||f.nombre.toLowerCase().includes(cli.toLowerCase()));
    if(!cliObj){alert("Cliente no encontrado");return;}
    if(rol==='empleado' && cliObj.deuda>=config.limite_fiado){ alert("BLOQUEADO: Debe "+fmt(cliObj.deuda)+" supera límite "+fmt(config.limite_fiado)); return; }
    cliObj.deuda+=carrito.reduce((s,p)=>s+Number(p.precio_final),0); cliObj.historial.push({tipo:'fiado',monto:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now()}); localStorage.setItem('pos_fiados',JSON.stringify(fiados));
  }
  const canvas=$('canvas-factura'); canvas.width=384; canvas.height=700; const ctx=canvas.getContext('2d'); ctx.fillStyle="#fff";ctx.fillRect(0,0,384,700);ctx.fillStyle="#000";ctx.font="bold 16px monospace";let y=22;
  ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA').substring(0,28),10,y); y+=20; ctx.font="12px monospace"; ctx.fillText("Tel:"+(localStorage.getItem('tienda_tel')||''),10,y); y+=18; ctx.fillText("Metodo:"+metodo.toUpperCase()+" "+cli,10,y); y+=18; ctx.fillText("-------------------------------",10,y); y+=16;
  carrito.forEach(p=>{y+=16; ctx.fillText(p.nombre.substring(0,20)+" "+fmt(p.precio_final),10,y);});
  y+=22; ctx.font="bold 16px monospace"; ctx.fillText($('total').innerText,10,y);
  $('img-factura').src=canvas.toDataURL('image/png'); $('bloque-factura').style.display='block';
  ventas.push({total:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now(),productos:JSON.parse(JSON.stringify(carrito)),metodo}); localStorage.setItem('pos_ventas',JSON.stringify(ventas));
  carrito=[]; renderCarrito(); renderBalance();
}
function compartirWhatsapp(){ $('canvas-factura').toBlob(b=>{const file=new File([b],"factura.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[file]})) navigator.share({files:[file]}); else {let a=document.createElement('a');a.href=$('img-factura').src;a.download='factura.png';a.click(); window.open("https://wa.me/?text=Factura");}});}

function guardarCfgTienda(){ localStorage.setItem('tienda_nombre',$('cfg-nombre').value); localStorage.setItem('tienda_tel',$('cfg-tel').value); alert("Guardado"); }
function guardarConfigJefe(){ if(rol!=='jefe')return; if($('cfg-pass-jefe').value) config.pass_jefe=$('cfg-pass-jefe').value; if($('cfg-pass-emp').value) config.pass_empleado=$('cfg-pass-emp').value; if($('cfg-margen').value) config.margen_empleado=Number($('cfg-margen').value); if($('cfg-limite').value) config.limite_fiado=Number($('cfg-limite').value); localStorage.setItem('pos_config',JSON.stringify(config)); alert("Config guardada"); }
function renderBalance(){ let mes=ventas.filter(v=>v.fecha>Date.now()-30*24*3600*1000); let tot=mes.reduce((s,v)=>s+v.total,0); $('balance-mes').innerHTML="30 días: <b>"+fmt(tot)+"</b> - "+mes.length+" ventas"; let c={}; ventas.forEach(v=>v.productos.forEach(p=>c[p.nombre]=(c[p.nombre]||0)+1)); let top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3); $('top3').innerHTML=top.map(t=>t[0]+": "+t[1]).join('<br>')||'Sin ventas'; }
function cuadreCaja(){ let hoy=ventas.filter(v=>new Date(v.fecha).toDateString()==new Date().toDateString()); alert("Hoy: "+fmt(hoy.reduce((s,v)=>s+v.total,0))+" - "+hoy.length+" ventas"); }
$('cliente-cobro').addEventListener('input',e=>{let t=e.target.value.toLowerCase(); let f=fiados.find(x=>x.nombre.toLowerCase().includes(t)||x.codigo.toLowerCase()==t); $('preview-cliente').innerText=f?`Encontrado: ${f.nombre} debe ${fmt(f.deuda)}`:'';});
$('cfg-nombre').value=localStorage.getItem('tienda_nombre')||''; $('cfg-tel').value=localStorage.getItem('tienda_tel')||'';
renderInv();renderFiado();renderBalance();
</script>
</body>
</html>
