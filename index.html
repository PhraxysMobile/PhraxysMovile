<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Patía V1.0</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ESTETICA SIMPLE PARA PERSONA MAYOR */
body{font-family:Arial; background:#f5f5f5; margin:0; padding-bottom:80px}
.modulo{display:none; padding:15px}.activo{display:block}
.card{background:#fff; padding:12px; margin:8px 0; border-radius:12px; box-shadow:0 1px 3px #ccc}
input,button{font-size:18px; padding:10px; border-radius:8px; border:1px solid #ccc; width:100%; margin:5px 0}
.btn-verde{background:#22c55e; color:#fff; font-weight:bold; border:none}
.btn-flotante{position:fixed; bottom:70px; right:20px; background:#2563eb; color:#fff; border-radius:50px; padding:15px 20px; z-index:99; width:auto}
#nav{position:fixed; bottom:0; width:100%; display:flex; background:#fff; border-top:1px solid #ddd}
#nav button{flex:1; border:none; background:none; font-size:14px}
#reader{width:100%; background:#000}
#btn-flash-venta, #btn-flash-inv{display:none} /* FIX: flash solo cuando camara abierta */
</style>
</head>
<body>

<!-- MODULO 1: VENDER -->
<div id="mod-vender" class="modulo activo">
  <!-- BARRA + BOTON CAMARA QUE ABRE Y CIERRA -->
  <div style="display:flex; gap:5px">
    <input id="search" placeholder="Buscar producto..." oninput="buscarProducto(this.value)">
    <button style="width:60px" onclick="toggleCam('venta')">📷</button>
  </div>
  <button id="btn-flash-venta" onclick="toggleFlash()">🔦 Flash</button>
  <div id="reader-venta" style="display:none"></div>

  <div id="carrito"></div>
  <h2 id="total">TOTAL: $ 0</h2>
  <button class="btn-verde" onclick="abrirCobro()">COBRAR</button>
  <button onclick="cuadreCaja()" style="margin-top:20px; background:#eee">📊 CUADRE DE CAJA DIARIO</button>
</div>

<!-- MODULO 2: INVENTARIO -->
<div id="mod-inventario" class="modulo">
  <div id="lista-inv"></div>
  <button class="btn-flotante" onclick="abrirModalInv()">+ Agregar Producto</button>
</div>

<!-- MODULO 3: FIADO -->
<div id="mod-fiado" class="modulo">
  <div id="lista-fiado"></div>
  <button class="btn-flotante" onclick="abrirModalFiado()">+ Agregar Persona</button>
</div>

<!-- MODULO 4: AJUSTES + BALANCE -->
<div id="mod-ajustes" class="modulo">
  <h3>Ajustes Tienda</h3>
  <input id="cfg-nombre" placeholder="Nombre tienda">
  <input id="cfg-tel" placeholder="Teléfono">
  <button onclick="guardarCfg()">Guardar</button>
  <hr>
  <h3>Balance 1 Mes</h3>
  <div id="balance-mes"></div>
  <h3>Top 3 Vendidos</h3>
  <div id="top3"></div>
</div>

<!-- MODALES -->
<div id="modal-inv" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; padding:20px; overflow:auto">
  <h3>Producto</h3>
  <!-- FIX CAMARA: mismo boton abre y cierra, y al escanear se cierra sola -->
  <div style="display:flex; gap:5px">
    <input id="inv-codigo" placeholder="Código barras">
    <button style="width:60px" onclick="toggleCam('inv')">📷</button>
  </div>
  <button id="btn-flash-inv" onclick="toggleFlash()">🔦 Flash</button>
  <div id="reader-inv" style="display:none"></div>

  <input id="inv-nombre" placeholder="Nombre">
  <input id="inv-costo" type="number" placeholder="Precio costo">
  <input id="inv-publico" type="number" placeholder="Precio público">
  <input id="inv-stock" type="number" placeholder="Existencias">
  <button class="btn-verde" onclick="guardarProducto()">Agregar a Inventario</button>
  <button onclick="cerrarModalInv()">Salir</button>
</div>

<div id="modal-cobro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:101; padding:20px">
  <h3>Método de Pago</h3>
  <select id="metodo" style="width:100%; padding:12px; font-size:18px">
    <option value="efectivo">Efectivo</option>
    <option value="credito">Crédito / Fiado</option>
    <option value="transferencia">Transferencia</option>
  </select>
  <input id="cliente-cobro" placeholder="Nombre o código fiado (si aplica)">
  <div id="preview-cliente"></div>
  <button class="btn-verde" onclick="finalizarCobro()">Generar Factura</button>
  <div id="acciones-factura" style="display:none">
    <canvas id="canvas-factura" style="display:none"></canvas>
    <img id="img-factura" style="width:100%; border:1px solid #000; margin-top:10px">
    <button onclick="compartirWhatsapp()">Enviar por WhatsApp</button>
    <button onclick="window.print()">Imprimir</button>
  </div>
  <button onclick="cerrarCobro()">Cerrar</button>
</div>

<div id="nav">
  <button onclick="verMod('vender')">Vender</button>
  <button onclick="verMod('inventario')">Inventario</button>
  <button onclick="verMod('fiado')">Fiado</button>
  <button onclick="verMod('ajustes')">Ajustes</button>
</div>

<script>
// --- BASE DE DATOS OFFLINE ---
let productos = JSON.parse(localStorage.getItem('pos_prod')||'[]');
let fiados = JSON.parse(localStorage.getItem('pos_fiados')||'[]');
let ventas = JSON.parse(localStorage.getItem('pos_ventas')||'[]');
let carrito = [];
let html5QrCode = null;
let camAbierta = false;

// --- UTILS COP CON PUNTOS ---
const fmt = n => "$ " + Number(n||0).toLocaleString('es-CO'); // 1500 -> $ 1.500

// --- FIX 1: SCANNER SOLO BARRAS, NO QR ---
async function toggleCam(tipo){
  const idReader = tipo==='venta'? 'reader-venta' : 'reader-inv';
  const idFlash = tipo==='venta'? 'btn-flash-venta' : 'btn-flash-inv';
  const readerEl = document.getElementById(idReader);
  const flashEl = document.getElementById(idFlash);

  if(camAbierta){
    await html5QrCode.stop(); html5QrCode.clear();
    readerEl.style.display='none'; flashEl.style.display='none'; camAbierta=false; return;
  }
  readerEl.style.display='block'; flashEl.style.display='block';
  html5QrCode = new Html5Qrcode(idReader);
  camAbierta=true;
  html5QrCode.start({facingMode:"environment"},
  {
    fps:10,
    // AQUI ESTA EL FIX: solo estos formatos
    formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.UPC_A ]
  },
  (decoded)=>{
    if(tipo==='venta') buscarProducto(decoded, true);
    else document.getElementById('inv-codigo').value = decoded;
    toggleCam(tipo); // se cierra al escanear
  });
}
function toggleFlash(){
  html5QrCode.getRunningTrackCameraCapabilities().torchFeature().apply(true);
}

// --- VENDER ---
function buscarProducto(txt, esCodigo=false){
  const lista = productos.filter(p=> esCodigo? p.codigo==txt : p.nombre.toLowerCase().includes(txt.toLowerCase()));
  if(esCodigo && lista[0]) addCarrito(lista[0]);
}
function addCarrito(p){
  carrito.push({...p, precio_final: p.publico});
  renderCarrito();
}
function renderCarrito(){
  let tot=0;
  document.getElementById('carrito').innerHTML = carrito.map((c,i)=>{
    tot+=Number(c.precio_final);
    // FIX: existencias solo en carrito, no en factura
    return `<div class="card"> ${c.nombre} <small>Stock:${c.stock}</small><br>
    <input type="number" value="${c.precio_final}" onchange="carrito[${i}].precio_final=this.value; renderCarrito()" style="width:120px"> ${fmt(c.precio_final)}</div>`
  }).join('');
  document.getElementById('total').innerText = "TOTAL: " + fmt(tot);
}

// --- COBRO + FIX 2: FACTURA COMO IMAGEN 58MM ---
function finalizarCobro(){
  const metodo = document.getElementById('metodo').value;
  const cliente = document.getElementById('cliente-cobro').value;
  if(metodo==='credito'){
    let f = fiados.find(x=> x.nombre==cliente || x.codigo==cliente);
    if(f){ f.deuda = (f.deuda||0) + carrito.reduce((s,p)=>s+Number(p.precio_final),0); }
  }
  // Generar imagen
  const canvas = document.getElementById('canvas-factura');
  canvas.width=384; canvas.height=600;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,384,600);
  ctx.fillStyle="#000"; ctx.font="bold 18px monospace";
  let y=20;
  ctx.fillText(localStorage.getItem('tienda_nombre')||'TIENDA',10,y);
  ctx.font="14px monospace"; y+=20;
  ctx.fillText("Tel: "+(localStorage.getItem('tienda_tel')||''),10,y); y+=20;
  ctx.fillText("Metodo: "+metodo+" "+cliente,10,y); y+=20;
  carrito.forEach(p=>{ y+=20; ctx.fillText(p.nombre.substring(0,20)+" "+fmt(p.precio_final),10,y); });
  y+=30; ctx.font="bold 16px monospace";
  ctx.fillText("TOTAL: "+document.getElementById('total').innerText,10,y);

  document.getElementById('img-factura').src = canvas.toDataURL();
  document.getElementById('acciones-factura').style.display='block';

  // Guardar venta para balance
  ventas.push({total:carrito.reduce((s,p)=>s+Number(p.precio_final),0), fecha:Date.now(), productos:carrito});
  localStorage.setItem('pos_ventas', JSON.stringify(ventas));
  carrito=[]; renderCarrito();
}
function compartirWhatsapp(){
  canvas.toBlob(blob=>{
    const file=new File([blob],"factura.png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:"Factura"});
    } else {
      // fallback: descargar y abrir whatsapp
      const url=document.getElementById('img-factura').src;
      window.open("https://wa.me/?text=Factura "+encodeURIComponent(url));
    }
  });
}

// --- INVENTARIO + FIADO + OTROS (resumido para que no falle) ---
function guardarProducto(){
  productos.push({codigo:inv_codigo.value, nombre:inv_nombre.value, costo:inv_costo.value, publico:inv_publico.value, stock:inv_stock.value});
  localStorage.setItem('pos_prod', JSON.stringify(productos)); cerrarModalInv(); renderInv();
}
function renderInv(){ lista_inv.innerHTML = productos.map(p=>`<div class="card">${p.nombre} - ${fmt(p.publico)} - Stock:${p.stock} <button onclick="editar('${p.codigo}')">✏️</button></div>`).join(''); }
function verMod(m){ document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo')); document.getElementById('mod-'+m).classList.add('activo'); if(m=='inventario')renderInv(); if(m=='ajustes')renderBalance(); }
function abrirModalInv(){ modal_inv.style.display='block' } function cerrarModalInv(){ modal_inv.style.display='none' }
function abrirCobro(){ modal_cobro.style.display='block' } function cerrarCobro(){ modal_cobro.style.display='none' }
function guardarCfg(){ localStorage.setItem('tienda_nombre',cfg_nombre.value); localStorage.setItem('tienda_tel',cfg_tel.value); alert('Guardado'); }
function renderBalance(){
  const mes = ventas.filter(v=> v.fecha > Date.now()-30*24*60*60*1000).reduce((s,v)=>s+v.total,0);
  balance_mes.innerText = fmt(mes);
  // top 3
  let conteo={}; ventas.forEach(v=>v.productos.forEach(p=>conteo[p.nombre]=(conteo[p.nombre]||0)+1));
  let top = Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,3);
  top3.innerHTML = top.map(t=>`${t[0]}: ${t[1]} ventas`).join('<br>');
}
function cuadreCaja(){
  const hoy = ventas.filter(v=> new Date(v.fecha).toDateString()==new Date().toDateString()).reduce((s,v)=>s+v.total,0);
  alert("Cuadre Hoy: "+fmt(hoy));
}
verMod('vender');
</script>
</body>
</html>
