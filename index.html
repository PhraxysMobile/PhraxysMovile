<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>POS Patia V1.1.2</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:system-ui,Arial;background:#f5f5f5;margin:0;padding-bottom:85px}
.modulo{display:none;padding:12px}.activo{display:block!important}
.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 3px #ccc;position:relative;word-break:break-word}
input,button,select{font-size:18px;padding:14px;border-radius:12px;border:1px solid #ccc;width:100%;margin:6px 0;box-sizing:border-box}
.btn-verde{background:#22c55e;color:#fff;font-weight:bold;border:none}
.btn-azul{background:#2563eb;color:#fff;border:none}
.btn-flotante{position:fixed;bottom:80px;right:16px;background:#111;color:#fff;border-radius:50px;padding:16px 20px;z-index:90;width:auto;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:80}
#nav button{flex:1;border:none;background:none;padding:14px 2px;font-size:13px;font-weight:600}
#reader-venta,#reader-inv{width:100%;display:none;border-radius:12px;overflow:hidden;background:#000}
#btn-flash-venta,#btn-flash-inv{display:none}
.lapiz{position:absolute;right:10px;top:10px;font-size:20px}
</style>
</head>
<body>

<div id="login-screen" style="position:fixed;inset:0;background:#0f0f0f;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:28px;box-sizing:border-box">
  <h1 style="color:#fff;text-align:center;margin:0">POS PATÍA</h1>
  <p id="txt-claves" style="color:#888;text-align:center">Cargando...</p>
  <input id="login-pass" type="tel" inputmode="numeric" placeholder="Clave" style="font-size:26px;text-align:center;letter-spacing:6px">
  <button class="btn-verde" onclick="login()" style="font-size:20px;margin-top:10px">ENTRAR</button>
  <button onclick="resetClaves()" style="background:transparent;color:#555;border:1px dashed #333;margin-top:18px;font-size:13px">RESET CLAVES A 1234 / 0000</button>
</div>

<div id="mod-vender" class="modulo activo">
  <div style="display:flex;justify-content:space-between;align-items:center"><b id="rol-label" style="background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px"></b><button onclick="logout()" style="width:auto;background:#000;color:#fff;padding:6px 14px;font-size:14px">Salir</button></div>
  <div style="display:flex;gap:6px;margin-top:10px"><input id="search" placeholder="Buscar producto..." oninput="buscarProducto(this.value)"><button style="width:70px;background:#111;color:#fff" onclick="toggleCam('venta')">📷</button></div>
  <button id="btn-flash-venta" onclick="toggleFlash()">🔦 Flash</button><div id="reader-venta"></div>
  <div id="sugerencias"></div><div id="carrito"></div>
  <h2 id="total" style="text-align:right">TOTAL: $ 0</h2>
  <button class="btn-verde" onclick="abrirCobro()">COBRAR</button>
  <button onclick="cuadreCaja()" style="background:#fff;border:1px solid #000">📊 CUADRE DE CAJA</button>
</div>

<div id="mod-inventario" class="modulo"><h3>Inventario</h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv()">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3>Fiados</h3><div id="lista-fiado"></div><button id="btn-add-fiado" class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>
<div id="mod-gastos" class="modulo"><h3>Gastos Internos</h3><div id="lista-gastos"></div><button class="btn-flotante" style="background:#f59e0b" onclick="abrirModalGasto()">+ Gasto</button></div>
<div id="mod-ajustes" class="modulo">
  <h3>Tienda</h3><input id="cfg-nombre" placeholder="Nombre tienda"><input id="cfg-tel" placeholder="Tel"><button class="btn-azul" onclick="guardarCfgTienda()">Guardar</button>
  <div id="panel-jefe" class="card" style="background:#fef9c3;margin-top:18px"><h4 style="margin:0 0 8px">🔑 Control Jefe</h4><input id="cfg-pass-jefe" placeholder="Nueva clave Jefe"><input id="cfg-pass-emp" placeholder="Nueva clave Empleado"><input id="cfg-margen" type="number" placeholder="% margen mínimo ej 20"><input id="cfg-limite" type="number" placeholder="Límite deuda bloqueo ej 50000"><button class="btn-verde" onclick="guardarConfigJefe()">Guardar Config Jefe</button></div>
  <div id="bloque-balance" style="margin-top:12px"><div id="balance-mes" class="card"></div><div id="top3" class="card"></div><div id="balance-gastos" class="card"></div></div>
</div>

<div id="modal-inv" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px;overflow:auto"><h3 id="titulo-inv">Producto</h3><div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código"><button style="width:70px" onclick="toggleCam('inv')">📷</button></div><button id="btn-flash-inv" onclick="toggleFlash()">🔦</button><div id="reader-inv"></div><input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" type="number" placeholder="Costo"><input id="inv-publico" type="number" placeholder="Precio público"><input id="inv-stock" type="number" placeholder="Stock"><button class="btn-verde" onclick="guardarProducto()">Guardar Producto</button><button onclick="cerrarModalInv()" style="background:#eee">Cancelar</button></div>
<div id="modal-fiado" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Nuevo Deudor (Solo Jefe)</h3><input id="fia-nombre" placeholder="Nombre completo"><input id="fia-tel" placeholder="Tel"><input id="fia-codigo" placeholder="Código corto ej JUAN"><input id="fia-deuda" type="number" placeholder="Deuda inicial" value="0"><button class="btn-verde" onclick="guardarFiado()">Guardar Deudor</button><button onclick="cerrarModalFiado()" style="background:#eee">Cancelar</button></div>
<div id="modal-gasto" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Nuevo Gasto Interno</h3><input id="gas-que" placeholder="Qué es? Ej: Transporte"><input id="gas-para" placeholder="Para qué? Ej: Traer arroz"><input id="gas-precio" type="number" placeholder="Valor $"><button class="btn-verde" style="background:#f59e0b" onclick="guardarGasto()">Guardar Gasto</button><button onclick="cerrarModalGasto()" style="background:#eee">Cancelar</button></div>
<div id="modal-cobro" style="display:none;position:fixed;inset:0;background:#fff;z-index:101;padding:16px;overflow:auto"><h3>Cobro</h3><select id="metodo"><option value="efectivo">Efectivo</option><option value="credito">Fiado (solo existentes)</option><option value="transferencia">Transferencia</option></select><input id="cliente-cobro" placeholder="Escribe nombre o código fiado"><div id="preview-cliente" style="font-weight:bold;color:#d97706;margin:6px 0"></div><button class="btn-verde" onclick="finalizarCobro()">GENERAR FACTURA</button><div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;margin-top:12px;border:1px dashed #000;background:#fff"><button class="btn-azul" onclick="compartirWhatsapp()" style="margin-top:8px">Compartir WhatsApp / Guardar</button></div><button onclick="cerrarCobro()" style="background:#eee">Cerrar</button></div>

<div id="nav"><button onclick="verMod('vender')">Vender</button><button id="btn-nav-inv" onclick="verMod('inventario')">Inv</button><button onclick="verMod('fiado')">Fiado</button><button onclick="verMod('gastos')">Gastos</button><button id="btn-nav-ajustes" onclick="verMod('ajustes')">Ajustes</button></div>

<script>
/* CONFIG SEGURA */
let _old={}; try{ _old=JSON.parse(localStorage.getItem('pos_config')||'{}'); }catch(e){}
let config={
  pass_jefe: (_old.pass_jefe && String(_old.pass_jefe).trim())? String(_old.pass_jefe).trim() : "1234",
  pass_empleado: (_old.pass_empleado && String(_old.pass_empleado).trim())? String(_old.pass_empleado).trim() : "0000",
  margen_empleado: _old.margen_empleado!=null? Number(_old.margen_empleado) : 20,
  limite_fiado: _old.limite_fiado!=null? Number(_old.limite_fiado) : 50000
};
localStorage.setItem('pos_config',JSON.stringify(config));

let rol=null;
let productos=JSON.parse(localStorage.getItem('pos_prod')||'[]');
let fiados=JSON.parse(localStorage.getItem('pos_fiados')||'[]');
let ventas=JSON.parse(localStorage.getItem('pos_ventas')||'[]');
let gastos=JSON.parse(localStorage.getItem('pos_gastos')||'[]');
let carrito=[]; let html5QrCode=null; let camAbierta=false; let editIndex=-1;
const fmt=n=>"$ "+Number(n||0).toLocaleString('es-CO');
const $=id=>document.getElementById(id);
$('txt-claves').innerText="Jefe: "+config.pass_jefe+" / Empleado: "+config.pass_empleado;

function resetClaves(){ localStorage.removeItem('pos_config'); location.reload(); }
function login(){
  let p=String($('login-pass').value||'').trim();
  if(!p){ alert("Escribe clave"); return; }
  if(p===String(config.pass_jefe)){ rol='jefe'; }
  else if(p===String(config.pass_empleado)){ rol='empleado'; }
  else{ alert("Clave incorrecta. Jefe es "+config.pass_jefe+" y Empleado es "+config.pass_empleado); return; }
  $('login-screen').style.display='none';
  $('rol-label').innerText="ROL: "+rol.toUpperCase();
  aplicarRol();
}
function aplicarRol(){
  if(rol==='empleado'){
    $('btn-nav-inv').style.display='none'; $('btn-nav-ajustes').style.display='none'; $('btn-add-fiado').style.display='none';
    $('panel-jefe').style.display='none'; $('bloque-balance').style.display='none';
  }else{
    $('btn-nav-inv').style.display=''; $('btn-nav-ajustes').style.display=''; $('btn-add-fiado').style.display=''; $('panel-jefe').style.display='block'; $('bloque-balance').style.display='block';
  }
  verMod('vender');
}
function logout(){ rol=null; $('login-screen').style.display='flex'; $('login-pass').value=''; $('login-pass').focus(); }

async function toggleCam(t){
  const idR=t==='venta'?'reader-venta':'reader-inv';
  const elR=$(idR);
  if(camAbierta){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} elR.style.display='none'; camAbierta=false; return; }
  elR.style.display='block';
  html5QrCode=new Html5Qrcode(idR); camAbierta=true;
  html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:100}},(dec)=>{ if(t==='venta') buscarProducto(dec,true); else $('inv-codigo').value=dec; toggleCam(t); },()=>{}).catch(()=>{ camAbierta=false; elR.style.display='none'; alert("No se pudo abrir cámara"); });
}
function toggleFlash(){ try{ const cap=html5QrCode.getRunningTrackCameraCapabilities(); if(cap.torchFeature().isSupported()){ cap.torchFeature().apply(!cap.torchFeature().value()); } }catch(e){} }

function buscarProducto(txt,esCod=false){
  if(!txt){ $('sugerencias').innerHTML=''; return; }
  let res=productos.filter(p=> esCod? p.codigo===txt : (p.nombre.toLowerCase().includes(txt.toLowerCase()) || p.codigo.toLowerCase().includes(txt.toLowerCase())) );
  if(esCod && res[0]){ addCarrito(res[0]); $('search').value=''; $('sugerencias').innerHTML=''; return; }
  $('sugerencias').innerHTML=res.slice(0,6).map(r=>`<div class="card" onclick="addCarrito(productos.find(p=>p.codigo==='${r.codigo.replace(/'/g,"")}'))"><b>${r.nombre}</b> - ${fmt(r.publico)} <small>Stock:${r.stock}</small></div>`).join('');
}
function addCarrito(p){ carrito.push({...p, precio_final: Number(p.publico)}); renderCarrito(); }
function renderCarrito(){
  let tot=0;
  $('carrito').innerHTML=carrito.map((c,i)=>{ tot+=Number(c.precio_final); let min=Number(c.costo)+Number(c.costo)*config.margen_empleado/100; let info=rol==='jefe'?`Costo:${fmt(c.costo)} Min:${fmt(min)}`:`Min:${fmt(min)}`; return `<div class="card"><b>${c.nombre}</b> <small>${info} Stock:${c.stock}</small><div style="display:flex;gap:6px;margin-top:6px"><input type="number" value="${c.precio_final}" onchange="validarPrecio(${i},this.value)" style="flex:1"><button onclick="carrito.splice(${i},1);renderCarrito()" style="width:50px;background:#fee">X</button></div><small>${fmt(c.precio_final)}</small></div>`; }).join('');
  $('total').innerText="TOTAL: "+fmt(tot);
}
function validarPrecio(i,v){
  let prod=carrito[i]; let minimo=Number(prod.costo)+Number(prod.costo)*config.margen_empleado/100;
  if(rol==='empleado' && Number(v)<minimo){ alert("No puedes bajar de "+fmt(minimo)+" margen "+config.margen_empleado+"%"); carrito[i].precio_final=minimo; } else { carrito[i].precio_final=Number(v); }
  renderCarrito();
}

function verMod(m){
  try{ html5QrCode?.stop(); }catch(e){} document.querySelectorAll('[id^="reader-"]').forEach(e=>e.style.display='none'); camAbierta=false;
  document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo')); $('mod-'+m).classList.add('activo');
  if(m==='inventario') renderInv(); if(m==='fiado') renderFiado(); if(m==='gastos') renderGastos(); if(m==='ajustes') renderBalance();
}
function abrirModalInv(i=-1){ if(rol!=='jefe'){ alert("Solo jefe"); return; } editIndex=i; $('modal-inv').style.display='block'; if(i>=0){ let p=productos[i]; $('inv-codigo').value=p.codigo; $('inv-nombre').value=p.nombre; $('inv-costo').value=p.costo; $('inv-publico').value=p.publico; $('inv-stock').value=p.stock; } else { $('inv-codigo').value=''; $('inv-nombre').value=''; $('inv-costo').value=''; $('inv-publico').value=''; $('inv-stock').value=''; } }
function cerrarModalInv(){ $('modal-inv').style.display='none'; editIndex=-1; }
function guardarProducto(){ let o={ codigo:$('inv-codigo').value.trim(), nombre:$('inv-nombre').value.trim(), costo:Number($('inv-costo').value||0), publico:Number($('inv-publico').value||0), stock:Number($('inv-stock').value||0) }; if(!o.codigo||!o.nombre){ alert("Falta código y nombre"); return; } if(editIndex>=0) productos[editIndex]=o; else productos.push(o); localStorage.setItem('pos_prod',JSON.stringify(productos)); cerrarModalInv(); renderInv(); }
function renderInv(){ $('lista-inv').innerHTML=productos.map((p,i)=>`<div class="card"><b>${p.nombre}</b><br>${fmt(p.publico)} Stock:${p.stock}<br><small>${p.codigo} | Costo ${fmt(p.costo)}</small><span class="lapiz" onclick="abrirModalInv(${i})">✏️</span></div>`).join('')||'<div class="card">Sin productos</div>'; }

function abrirModalFiado(){ if(rol!=='jefe'){ alert("Solo jefe puede crear deudores"); return; } $('modal-fiado').style.display='block'; $('fia-nombre').value=''; $('fia-tel').value=''; $('fia-codigo').value=''; $('fia-deuda').value='0'; }
function cerrarModalFiado(){ $('modal-fiado').style.display='none'; }
function guardarFiado(){ if(rol!=='jefe'){ alert("Solo jefe"); return; } let n=$('fia-nombre').value.trim(); if(!n){ alert("Falta nombre"); return; } fiados.push({ nombre:n, telefono:$('fia-tel').value.trim(), codigo:($('fia-codigo').value.trim()||n.slice(0,4).toUpperCase()), deuda:Number($('fia-deuda').value||0), historial:[] }); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); cerrarModalFiado(); renderFiado(); }
function renderFiado(){ $('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b>${f.nombre}</b> (${f.codigo})<br>Debe: <b>${fmt(f.deuda)}</b> - Tel:${f.telefono}<br><div style="display:flex;gap:6px"><button onclick="abonar(${i})" style="background:#dcfce7">Abono</button><button onclick="verCuenta(${i})" style="background:#fff">Ver</button></div></div>`).join('')||'Sin fiados'; }
function abonar(i){ let m=Number(prompt("Cuánto abona?")||0); if(m>0){ fiados[i].deuda=Math.max(0,fiados[i].deuda-m); fiados[i].historial.push({tipo:'abono',monto:m,fecha:Date.now(),quien:rol}); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); renderFiado(); } }
function verCuenta(i){ let f=fiados[i]; alert(f.nombre+" - Debe "+fmt(f.deuda)+"\nHistorial: "+(f.historial||[]).length+" mov"); }

function abrirModalGasto(){ $('modal-gasto').style.display='block'; $('gas-que').value=''; $('gas-para').value=''; $('gas-precio').value=''; }
function cerrarModalGasto(){ $('modal-gasto').style.display='none'; }
function guardarGasto(){ let que=$('gas-que').value.trim(); let para=$('gas-para').value.trim(); let precio=Number($('gas-precio').value||0); if(!que||!precio){ alert("Falta qué y precio"); return; } gastos.push({ que, para, precio, fecha:Date.now(), quien:rol||'jefe' }); localStorage.setItem('pos_gastos',JSON.stringify(gastos)); cerrarModalGasto(); renderGastos(); renderBalance(); }
function renderGastos(){ $('lista-gastos').innerHTML=gastos.slice().reverse().map(g=>`<div class="card"><b>${g.que}</b> - ${fmt(g.precio)}<br><small>Para: ${g.para} | ${new Date(g.fecha).toLocaleString()} | Por: ${g.quien}</small></div>`).join('')||'Sin gastos hoy'; }

function abrirCobro(){ if(carrito.length===0){ alert("Carrito vacío"); return; } $('modal-cobro').style.display='block'; $('bloque-factura').style.display='none'; $('cliente-cobro').value=''; $('preview-cliente').innerText=''; }
function cerrarCobro(){ $('modal-cobro').style.display='none'; }
function finalizarCobro(){
  const metodo=$('metodo').value; const cli=$('cliente-cobro').value.trim(); let cliObj=null;
  if(metodo==='credito'){
    if(!cli){ alert("Escribe cliente fiado"); return; }
    cliObj=fiados.find(f=> f.codigo.toLowerCase()===cli.toLowerCase() || f.nombre.toLowerCase().includes(cli.toLowerCase()));
    if(!cliObj){ alert("Cliente no existe. Solo jefe puede crearlo en Fiados"); return; }
    if(rol==='empleado' && cliObj.deuda>=config.limite_fiado){ alert("BLOQUEADO: "+cliObj.nombre+" debe "+fmt(cliObj.deuda)+" supera límite "+fmt(config.limite_fiado)); return; }
    cliObj.deuda+=carrito.reduce((s,p)=>s+Number(p.precio_final),0);
    cliObj.historial.push({tipo:'fiado',monto:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now(),quien:rol});
    localStorage.setItem('pos_fiados',JSON.stringify(fiados));
  }
  // Factura canvas
  const canvas=$('canvas-factura'); canvas.width=380; canvas.height=600; const ctx=canvas.getContext('2d'); ctx.fillStyle="#fff"; ctx.fillRect(0,0,380,600); ctx.fillStyle="#000"; ctx.font="bold 16px monospace"; let y=20;
  ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA PATIA').slice(0,28),10,y); y+=18; ctx.font="12px monospace"; ctx.fillText("Tel: "+(localStorage.getItem('tienda_tel')||''),10,y); y+=14; ctx.fillText("Fecha: "+new Date().toLocaleString(),10,y); y+=14; ctx.fillText("Metodo: "+metodo.toUpperCase()+" "+cli+" ("+rol+")",10,y); y+=14; ctx.fillText("--------------------------------",10,y); y+=14;
  carrito.forEach(p=>{ y+=14; ctx.fillText((p.nombre.slice(0,18)+" "+fmt(p.precio_final)).slice(0,32),10,y); });
  y+=20; ctx.font="bold 16px monospace"; ctx.fillText($('total').innerText,10,y);
  $('img-factura').src=canvas.toDataURL('image/png'); $('bloque-factura').style.display='block';
  ventas.push({ total:carrito.reduce((s,p)=>s+Number(p.precio_final),0), fecha:Date.now(), productos:JSON.parse(JSON.stringify(carrito)), metodo, quien:rol });
  localStorage.setItem('pos_ventas',JSON.stringify(ventas));
  carrito=[]; renderCarrito(); renderFiado(); renderBalance();
}
function compartirWhatsapp(){ const img=$('img-factura'); if(!img.src){ alert("Genera factura primero"); return; } img.src; const a=document.createElement('a'); a.href=img.src; a.download='factura_'+Date.now()+'.png'; a.click(); setTimeout(()=>{ window.open("https://wa.me/?text=Factura%20Patia%20"+encodeURIComponent($('total').innerText)); },500); }

function guardarCfgTienda(){ localStorage.setItem('tienda_nombre',$('cfg-nombre').value.trim()); localStorage.setItem('tienda_tel',$('cfg-tel').value.trim()); alert("Tienda guardada"); }
function guardarConfigJefe(){ if(rol!=='jefe'){ alert("Solo jefe"); return; } if($('cfg-pass-jefe').value.trim()) config.pass_jefe=$('cfg-pass-jefe').value.trim(); if($('cfg-pass-emp').value.trim()) config.pass_empleado=$('cfg-pass-emp').value.trim(); if($('cfg-margen').value) config.margen_empleado=Number($('cfg-margen').value); if($('cfg-limite').value) config.limite_fiado=Number($('cfg-limite').value); localStorage.setItem('pos_config',JSON.str
