<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Patia V1.1 FIX 81->230</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:Arial;background:#f5f5f5;margin:0;padding-bottom:90px}.modulo{display:none;padding:15px}.activo{display:block}.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 3px #ccc;position:relative}input,button,select{font-size:18px;padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;margin:6px 0;box-sizing:border-box}.btn-verde{background:#22c55e;color:#fff;font-weight:bold;border:none}.btn-azul{background:#2563eb;color:#fff;border:none}.btn-flotante{position:fixed;bottom:75px;right:20px;background:#111;color:#fff;border-radius:50px;padding:16px 22px;z-index:99;width:auto;font-weight:bold}#nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:50}#nav button{flex:1;border:none;background:none;padding:14px 2px;font-size:12px}#reader-venta,#reader-inv{width:100%;display:none;border-radius:12px;overflow:hidden;background:#000}.lapiz{position:absolute;right:10px;top:10px;font-size:18px}</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:#111;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:30px;box-sizing:border-box"><h1 style="color:#fff;text-align:center;margin:0">POS PATÍA</h1><p id="txt-claves" style="color:#666;text-align:center;font-size:12px">Cargando...</p><input id="login-pass" type="password" placeholder="Contraseña" style="font-size:24px;text-align:center;letter-spacing:6px"><button class="btn-verde" onclick="login()" style="font-size:20px">Entrar</button><button onclick="resetSoloClaves()" style="background:transparent;color:#444;border:1px dashed #333;margin-top:18px;font-size:11px">RESET SOLO CLAVES 1234/0000 - No borra productos ni fiados</button></div>
<div id="mod-vender" class="modulo activo"><div style="display:flex;justify-content:space-between"><b id="rol-label" style="background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px"></b><button onclick="logout()" style="width:auto;background:#000;color:#fff;padding:6px 12px">Salir</button></div><div style="display:flex;gap:6px;margin-top:8px"><input id="search" placeholder="Buscar..." oninput="buscarProducto(this.value)"><button style="width:65px;background:#111;color:#fff" onclick="toggleCam('venta')">📷</button></div><div id="reader-venta"></div><div id="sugerencias"></div><div id="carrito"></div><h2 id="total" style="text-align:right">TOTAL: $ 0</h2><button class="btn-verde" onclick="abrirCobro()">COBRAR</button><button onclick="cuadreCaja()" style="background:#fff;border:1px solid #000">📊 CUADRE DIARIO</button></div>
<div id="mod-inventario" class="modulo"><h3>Inventario</h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv()">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3>Fiados</h3><div id="lista-fiado"></div><button id="btn-add-fiado" class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>
<div id="mod-gastos" class="modulo"><h3>Gastos Internos</h3><div id="lista-gastos"></div><button class="btn-flotante" style="background:#f59e0b" onclick="abrirModalGasto()">+ Gasto</button></div>
<div id="mod-ajustes" class="modulo"><h3>Ajustes Tienda</h3><input id="cfg-nombre" placeholder="Nombre tienda"><input id="cfg-tel" placeholder="Tel"><button class="btn-azul" onclick="guardarCfgTienda()">Guardar</button><hr><div id="panel-jefe" class="card" style="background:#fef3c7"><h4>🔑 Control Jefe</h4><input id="cfg-pass-jefe" placeholder="Nueva clave Jefe"><input id="cfg-pass-emp" placeholder="Nueva clave Empleado"><input id="cfg-margen" type="number" placeholder="% margen mínimo"><input id="cfg-limite" type="number" placeholder="Límite deuda"><button class="btn-verde" onclick="guardarConfigJefe()">Guardar Config Jefe</button></div><div id="bloque-balance"><div id="balance-mes" class="card"></div><div id="top3" class="card"></div><div id="balance-gastos" class="card"></div></div></div>
<div id="modal-inv" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px;overflow:auto"><h3>Producto</h3><div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código"><button style="width:65px" onclick="toggleCam('inv')">📷</button></div><div id="reader-inv"></div><input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" type="number" placeholder="Costo"><input id="inv-publico" type="number" placeholder="Público"><input id="inv-stock" type="number" placeholder="Stock"><button class="btn-verde" onclick="guardarProducto()">Guardar</button><button onclick="cerrarModalInv()" style="background:#eee">Cancelar</button></div>
<div id="modal-fiado" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Nuevo Deudor (Solo Jefe)</h3><input id="fia-nombre" placeholder="Nombre"><input id="fia-tel" placeholder="Tel"><input id="fia-codigo" placeholder="Código"><input id="fia-deuda" type="number" value="0"><button class="btn-verde" onclick="guardarFiado()">Guardar</button><button onclick="cerrarModalFiado()" style="background:#eee">Cancelar</button></div>
<div id="modal-gasto" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Nuevo Gasto</h3><input id="gas-que" placeholder="Qué es?"><input id="gas-para" placeholder="Para qué?"><input id="gas-precio" type="number" placeholder="Precio"><button class="btn-verde" style="background:#f59e0b" onclick="guardarGasto()">Guardar</button><button onclick="cerrarModalGasto()" style="background:#eee">Cancelar</button></div>
<div id="modal-cobro" style="display:none;position:fixed;inset:0;background:#fff;z-index:101;padding:16px;overflow:auto"><select id="metodo"><option value="efectivo">Efectivo</option><option value="credito">Fiado</option><option value="transferencia">Transferencia</option></select><input id="cliente-cobro" placeholder="Cliente fiado"><div id="preview-cliente" style="font-weight:bold;color:#2563eb"></div><button class="btn-verde" onclick="finalizarCobro()">Generar Factura</button><div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;margin-top:12px;border:1px dashed #000"><button class="btn-azul" onclick="compartirWhatsapp()">WhatsApp</button></div><button onclick="cerrarCobro()" style="background:#eee">Cerrar</button></div>
<div id="nav"><button onclick="verMod('vender')">Vender</button><button id="btn-nav-inv" onclick="verMod('inventario')">Inv</button><button onclick="verMod('fiado')">Fiado</button><button onclick="verMod('gastos')">Gastos</button><button id="btn-nav-ajustes" onclick="verMod('ajustes')">Ajustes</button></div>
<script>
function safeGet(k,d){try{let v=localStorage.getItem(k);if(!v)return d;return JSON.parse(v);}catch(e){if(k==='pos_config')localStorage.removeItem(k);return d;}}
let _o=safeGet('pos_config',{pass_jefe:"1234",pass_empleado:"0000",margen_empleado:20,limite_fiado:50000});
let config={pass_jefe:String(_o.pass_jefe||"1234").trim(),pass_empleado:String(_o.pass_empleado||"0000").trim(),margen_empleado:Number(_o.margen_empleado||20),limite_fiado:Number(_o.limite_fiado||50000)};
localStorage.setItem('pos_config',JSON.stringify(config));
let rol=null,productos=safeGet('pos_prod',[]),fiados=safeGet('pos_fiados',[]),ventas=safeGet('pos_ventas',[]),gastos=safeGet('pos_gastos',[]),carrito=[],html5QrCode=null,camAbierta=false,editIndex=-1;
const fmt=n=>"$ "+Number(n||0).toLocaleString('es-CO');const $=i=>document.getElementById(i);
$('txt-claves').innerText="Jefe:"+config.pass_jefe+" / Emp:"+config.pass_empleado+" - SEGURO no borra datos";
function resetSoloClaves(){if(confirm("Reset SOLO claves a 1234/0000? No borra productos/fiados")){localStorage.removeItem('pos_config');location.reload();}}
function login(){let p=($('login-pass').value||'').trim();if(p===config.pass_jefe)rol='jefe';else if(p===config.pass_empleado)rol='empleado';else{alert("Mala. Jefe:"+config.pass_jefe+" Emp:"+config.pass_empleado);return;}$('login-screen').style.display='none';$('rol-label').innerText="ROL:"+rol.toUpperCase();aplicarRol();}
function aplicarRol(){if(rol==='empleado'){$('btn-nav-inv').style.display='none';$('btn-nav-ajustes').style.display='none';$('btn-add-fiado').style.display='none';$('panel-jefe').style.display='none';$('bloque-balance').style.display='none';}else{$('btn-nav-inv').style.display='';$('btn-nav-ajustes').style.display='';$('btn-add-fiado').style.display='';$('panel-jefe').style.display='block';$('bloque-balance').style.display='block';}verMod('vender');}
function logout(){rol=null;$('login-screen').style.display='flex';$('login-pass').value='';}
async function toggleCam(t){let idR=t==='venta'?'reader-venta':'reader-inv';let el=$(idR);if(camAbierta){try{await html5QrCode.stop();html5QrCode.clear();}catch(e){}el.style.display='none';camAbierta=false;return;}el.style.display='block';html5QrCode=new Html5Qrcode(idR);camAbierta=true;html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:100}},d=>{if(t==='venta')buscarProducto(d,true);else $('inv-codigo').value=d;toggleCam(t);}).catch(()=>{camAbierta=false;el.style.display='none';});}
function buscarProducto(txt,esCod){if(!txt){$('sugerencias').innerHTML='';return;}let r=productos.filter(p=>esCod?p.codigo===txt:p.nombre.toLowerCase().includes(txt.toLowerCase())||p.codigo.includes(txt));if(esCod&&r[0]){addCarrito(r[0]);$('search').value='';$('sugerencias').innerHTML='';}else{$('sugerencias').innerHTML=r.slice(0,5).map(x=>`<div class="card" onclick="addCarrito(productos.find(p=>p.codigo=='${x.codigo}'))">${x.nombre} - ${fmt(x.publico)}</div>`).join('');}}
function addCarrito(p){carrito.push({...p,precio_final:p.publico});renderCarrito();}
function renderCarrito(){let tot=0;$('carrito').innerHTML=carrito.map((c,i)=>{tot+=Number(c.precio_final);let m=Number(c.costo)+Number(c.costo)*config.margen_empleado/100;return `<div class="card"><b>${c.nombre}</b> <small>Min:${fmt(m)} Stock:${c.stock}</small><br><input type="number" value="${c.precio_final}" onchange="validarPrecio(${i},this.value)" style="width:110px"> ${fmt(c.precio_final)} <button onclick="carrito.splice(${i},1);renderCarrito()" style="width:auto;background:#fee">X</button></div>`;}).join('');$('total').innerText="TOTAL: "+fmt(tot);}
function validarPrecio(i,v){let min=Number(carrito[i].costo)+Number(carrito[i].costo)*config.margen_empleado/100;if(rol==='empleado'&&Number(v)<min){alert("Minimo "+fmt(min));carrito[i].precio_final=min;}else carrito[i].precio_final=Number(v);renderCarrito();}
function verMod(m){try{html5QrCode?.stop();}catch(e){}document.querySelectorAll('[id^="reader-"]').forEach(e=>e.style.display='none');camAbierta=false;document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo'));$('mod-'+m).classList.add('activo');if(m=='inventario')renderInv();if(m=='fiado')renderFiado();if(m=='gastos')renderGastos();if(m=='ajustes')renderBalance();}
function abrirModalInv(i=-1){if(rol!=='jefe'){alert("Solo jefe");return;}editIndex=i;$('modal-inv').style.display='block';if(i>=0){let p=productos[i];$('inv-codigo').value=p.codigo;$('inv-nombre').value=p.nombre;$('inv-costo').value=p.costo;$('inv-publico').value=p.publico;$('inv-stock').value=p.stock;}else{$('inv-codigo').value='';$('inv-nombre').value='';$('inv-costo').value='';$('inv-publico').value='';$('inv-stock').value='';}}function cerrarModalInv(){$('modal-inv').style.display='none';}
function guardarProducto(){let o={codigo:$('inv-codigo').value.trim(),nombre:$('inv-nombre').value.trim(),costo:Number($('inv-costo').value||0),publico:Number($('inv-publico').value||0),stock:Number($('inv-stock').value||0)};if(!o.codigo||!o.nombre){alert("Falta");return;}if(editIndex>=0)productos[editIndex]=o;else productos.push(o);localStorage.setItem('pos_prod',JSON.stringify(productos));cerrarModalInv();renderInv();}
function renderInv(){$('lista-inv').innerHTML=productos.map((p,i)=>`<div class="card"><b>${p.nombre}</b><br>${fmt(p.publico)} Stock:${p.stock}<br><small>${p.codigo}</small><span class="lapiz" onclick="abrirModalInv(${i})">✏️</span></div>`).join('')||'Vacio';}
function abrirModalFiado(){if(rol!=='jefe'){alert("Solo jefe");return;}$('modal-fiado').style.display='block';}function cerrarModalFiado(){$('modal-fiado').style.display='none';}
function guardarFiado(){let n=$('fia-nombre').value.trim();if(!n)return;fiados.push({nombre:n,telefono:$('fia-tel').value,codigo:$('fia-codigo').value.trim()||n.slice(0,2).toUpperCase(),deuda:Number($('fia-deuda').value||0),historial:[]});localStorage.setItem('pos_fiados',JSON.stringify(fiados));cerrarModalFiado();renderFiado();}
function renderFiado(){$('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b>${f.nombre}</b> (${f.codigo})<br>Debe:${fmt(f.deuda)}<br><button onclick="abonar(${i})" style="width:48%">Abono</button><button onclick="verCuenta(${i})" style="width:48%">Cuenta</button></div>`).join('')||'Sin fiados';}
function abonar(i){let m=Number(prompt("Abono?")||0);if(m>0){fiados[i].deuda-=m;localStorage.setItem('pos_fiados',JSON.stringify(fiados));renderFiado();}}function verCuenta(i){alert(fiados[i].nombre+" debe "+fmt(fiados[i].deuda));}
function abrirModalGasto(){$('modal-gasto').style.display='block';}function cerrarModalGasto(){$('modal-gasto').style.display='none';}
function guardarGasto(){let q=$('gas-que').value.trim(),pa=$('gas-para').value.trim(),pr=Number($('gas-precio').value||0);if(!q||!pr)return;gastos.push({que:q,para:pa,precio:pr,fecha:Date.now(),quien:rol});localStorage.setItem('pos_gastos',JSON.stringify(gastos));cerrarModalGasto();renderGastos();}
function renderGastos(){$('lista-gastos').innerHTML=gastos.slice().reverse().map(g=>`<div class="card"><b>${g.que}</b> ${fmt(g.precio)}<br><small>${g.para} | ${new Date(g.fecha).toLocaleString()} | ${g.quien}</small></div>`).join('')||'Sin gastos';}
function abrirCobro(){if(!carrito.length){alert("Vacio");return;}$('modal-cobro').style.display='block';$('bloque-factura').style.display='none';}function cerrarCobro(){$('modal-cobro').style.display='none';}
function finalizarCobro(){let met=$('metodo').value,cli=$('cliente-cobro').value.trim(),obj=null;if(met==='credito'){if(!cli){alert("Escribe cliente");return;}obj=fiados.find(f=>f.codigo.toLowerCase()===cli.toLowerCase()||f.nombre.toLowerCase().includes(cli.toLowerCase()));if(!obj){alert("No existe");return;}if(rol==='empleado'&&obj.deuda>=config.limite_fiado){alert("Bloqueado supera "+fmt(config.limite_fiado));return;}obj.deuda+=carrito.reduce((s,p)=>s+Number(p.precio_final),0);localStorage.setItem('pos_fiados',JSON.stringify(fiados));}let c=$('canvas-factura');c.width=384;c.height=500;let ctx=c.getContext('2d');ctx.fillStyle="#fff";ctx.fillRect(0,0,384,500);ctx.fillStyle="#000";ctx.font="12px monospace";let y=20;ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA').slice(0,28),10,y);y+=14;carrito.forEach(p=>{y+=14;ctx.fillText(p.nombre.slice(0,20)+" "+fmt(p.precio_final),10,y);});y+=20;ctx.font="bold 14px monospace";ctx.fillText($('total').innerText,10,y);$('img-factura').src=c.toDataURL();$('bloque-factura').style.display='block';ventas.push({total:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now(),productos:carrito,metodo:met});localStorage.setItem('pos_ventas',JSON.stringify(ventas));carrito=[];renderCarrito();}
function compartirWhatsapp(){let a=document.createElement('a');a.href=$('img-factura').src;a.download='factura.png';a.click();}
function guardarCfgTienda(){localStorage.setItem('tienda_nombre',$('cfg-nombre').value);localStorage.setItem('tienda_tel',$('cfg-tel').value);alert("Guardado");}
function guardarConfigJefe(){if(rol!=='jefe')return;if($('cfg-pass-jefe').value)config.pass_jefe=$('cfg-pass-jefe').value.trim();if($('cfg-pass-emp').value)config.pass_empleado=$('cfg-pass-emp').value.trim();if($('cfg-margen').value)config.margen_empleado=Number($('cfg-margen').value);if($('cfg-limite').value)config.limite_fiado=Number($('cfg-limite').value);localStorage.setItem('pos_config',JSON.stringify(config));$('txt-claves').innerText="Jefe:"+config.pass_jefe+" Emp:"+config.pass_empleado;alert("Guardada");}
function renderBalance(){let mes=ventas.filter(v=>v.fecha>Date.now()-2592000000);let tot=mes.reduce((s,v)=>s+Number(v.total),0);let gMes=gastos.filter(g=>g.fecha>Date.now()-2592000000).reduce((s,g)=>s+Number(g.precio),0);$('balance-mes').innerHTML="Ventas 30d:"+fmt(tot)+"<br>Gastos:"+fmt(gMes)+"<br>Neto:"+fmt(tot-gMes);$('top3').innerHTML='';$('balance-gastos').innerHTML=gastos.slice(-5).map(g=>g.que+":"+fmt(g.precio)).join('<br>');}
function cuadreCaja(){let hoyV=ventas.filter(v=>new Date(v.fecha).toDateString()==new Date().toDateString());let tv=hoyV.reduce((s,v)=>s+Number(v.total),0);let hoyG=gastos.filter(g=>new Date(g.fecha).toDateString()==new Date().toDateString());let tg=hoyG.reduce((s,g)=>s+Number(g.precio),0);alert("Ventas:"+fmt(tv)+"\nGastos:"+fmt(tg)+"\nNeto:"+fmt(tv-tg));}
$('cliente-cobro').addEventListener('input',e=>{let t=e.target.value.toLowerCase();let f=fiados.find(x=>x.nombre.toLowerCase().includes(t)||x.codigo.toLowerCase()===t);$('preview-cliente').innerText=f?`Encontrado:${f.nombre} debe ${fmt(f.deuda)}`:'';});
$('cfg-nombre').value=localStorage.getItem('tienda_nombre')||'';$('cfg-tel').value=localStorage.getItem('tienda_tel')||'';
renderInv();renderFiado();renderGastos();renderBalance();
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                </html>
