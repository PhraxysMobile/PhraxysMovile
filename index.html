<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TIENDA PATIA V2.0 - FIX SOLICITUDES</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{ --bg:#F8FAFC; --card:#FFFFFF; --card2:#F1F5F9; --text:#0F172A; --text-sec:#64748B; --primary:#2563EB; --accent:#16A34A; --danger:#EF4444; --warning:#F59E0B; --border:#E2E8F0; --nav-bg:#FFFFFF; --nav-active:#16A34A; }
[data-theme="dark"]{ --bg:#0B1220; --card:#1E293B; --card2:#0F172A; --text:#F8FAFC; --text-sec:#94A3B8; --primary:#A3E635; --accent:#84CC16; --border:#334155; --nav-bg:#1E293B; --nav-active:#A3E635; }
*{box-sizing:border-box} body{font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);margin:0;padding-bottom:110px;transition:0.2s}
.modulo{display:none;padding:12px}.activo{display:block!important}
.card{background:var(--card);padding:14px;margin:10px 0;border-radius:16px;border:1px solid var(--border);}
input,button,select{font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--border);width:100%;margin:6px 0;background:var(--card);color:var(--text)}
.btn-verde{background:var(--accent);color:#fff;font-weight:900;border:none}.btn-amarillo{background:var(--primary);color:#fff;font-weight:900;border:none}
.btn-flotante{position:fixed;bottom:90px;right:16px;background:var(--primary);color:#fff;border-radius:50px;padding:16px 22px;z-index:90;font-weight:900;width:auto}
#topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:var(--nav-bg);border-top:1px solid var(--border);z-index:80;justify-content:space-around;padding:6px 0}
#nav button{flex:1;border:none;background:none;padding:8px 2px;font-size:10px;font-weight:700;color:var(--text-sec);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.activo-nav{color:var(--nav-active)} #nav button.ventas-centro{background:var(--accent);color:#fff;border-radius:22px;margin:0 8px;padding:10px 12px;font-size:12px;font-weight:900;transform:translateY(-8px);}
#notif-bell{position:relative;background:var(--card2);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px}
#notif-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800}.badge-pend{background:var(--warning);color:#000}.badge-notif{background:var(--danger);color:#fff;}
</style>
</head>
<body>
<div id="topbar"><div id="notif-bell" onclick="verMod('notificaciones')">🔔<span id="notif-badge" style="display:none">0</span></div><b id="tienda-label-top">TIENDA PATIA</b><div style="display:flex;gap:8px;align-items:center"><span id="empleado-label-top" style="background:var(--accent);color:#fff;padding:4px 8px;border-radius:12px;font-size:10px"></span><button id="btn-ajustes-top" onclick="verMod('ajustes')" style="width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:none">⚙️</button></div></div>
<div id="login-screen" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:28px">
<h1 style="color:var(--primary);text-align:center;margin:0">TIENDA PATÍA</h1><p style="text-align:center">V2.0 FIX SOLICITUDES</p>
<input id="login-user" placeholder="Usuario Ej: PATIA1" style="text-transform:uppercase;text-align:center;border:2px solid var(--primary);margin-top:20px">
<input id="login-pass" type="password" placeholder="Clave" style="text-align:center;border:2px solid var(--accent)">
<button class="btn-verde" onclick="login()" style="margin-top:12px">ENTRAR</button>
<button onclick="borrarSesion()" style="background:none;color:var(--text-sec);font-size:11px;border:none">Borrar sesión</button>
</div>
<div id="mod-vender" class="modulo"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b id="rol-label" style="background:var(--primary);color:#fff;padding:6px 12px;border-radius:20px;font-size:11px">ROL</b><span id="empleado-label" style="background:var(--accent);color:#fff;padding:6px 10px;border-radius:20px;font-size:10px"></span><span id="consecutivo" style="background:var(--card2);padding:6px 12px;border-radius:20px;font-size:11px">POS:0001</span><span id="tienda-label"></span><button onclick="logout()" style="width:auto;background:var(--danger);color:#fff;padding:6px 14px;border-radius:20px;font-size:11px">Salir</button></div><div style="display:flex;gap:8px;margin-top:12px"><input id="search" placeholder="🔍 Buscar..." oninput="buscarProducto(this.value)"></div><div id="sugerencias"></div><div id="carrito"></div><h2 id="total" style="text-align:right;color:var(--primary)">TOTAL: $ 0</h2><div style="display:flex;gap:10px"><button class="btn-amarillo" style="flex:1" onclick="abrirCobro('credito')">FIAR</button><button class="btn-verde" style="flex:2" onclick="abrirCobro('efectivo')">COBRAR</button></div></div>
<div id="mod-inventario" class="modulo"><h3>📦 Inventario - <span id="inv-tienda"></span></h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv(-1)" style="background:var(--accent)">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3>👥 Fiados</h3><div id="lista-fiado"></div><button class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>
<div id="mod-facturas" class="modulo"><h3>🧾 Facturas</h3><div id="lista-facturas"></div></div>
<div id="mod-caja" class="modulo"><h3>💰 Cuadre</h3><div id="caja-estado" class="card"></div></div>
<div id="mod-notificaciones" class="modulo"><h3>🔔 Notificaciones</h3><div id="lista-notifs"></div></div>
<div id="mod-solicitudes" class="modulo"><h3 style="color:var(--primary)">📩 Solicitudes - <span id="sol-tienda"></span> <span id="sol-pend" class="badge badge-pend">0 pend</span></h3><div style="display:flex;gap:6px;margin-bottom:10px"><button id="sol-f-pend" onclick="filtrarSol('pend')" style="flex:1;background:var(--warning);color:#000;font-weight:900;padding:10px;border-radius:10px;border:none">Pendientes</button><button id="sol-f-aprob" onclick="filtrarSol('aprob')" style="flex:1;background:var(--card2);padding:10px;border-radius:10px;border:none">Aprobadas</button><button id="sol-f-rech" onclick="filtrarSol('rech')" style="flex:1;background:var(--card2);padding:10px;border-radius:10px;border:none">Rechazadas</button></div><div id="lista-solicitudes"></div></div>
<div id="mod-gastos" class="modulo"><h3>💸 Gastos</h3><div style="display:flex;gap:8px;margin-top:8px"><button onclick="verSubGastos('gastos')" id="tab-gastos" style="flex:1;background:var(--warning);color:#000;font-weight:900;padding:10px;border-radius:10px;border:none">Gastos</button><button onclick="verSubGastos('compras')" id="tab-compras" style="flex:1;background:var(--card2);padding:10px;border-radius:10px;border:none">Compras</button></div><div id="lista-gastos"></div><div id="lista-compras" style="display:none"></div><button class="btn-flotante" onclick="abrirModalGasto()">+ Gasto</button><button class="btn-flotante" style="bottom:155px;background:var(--warning)" onclick="abrirModalCompra()">+ Compra</button></div>
<div id="mod-ajustes" class="modulo"><h3>⚙️ Ajustes - <span id="ajustes-tienda"></span></h3><div class="card"><h4>👷 Empleados</h4><input id="emp-nombre" placeholder="Nombre"><input id="emp-usuario" placeholder="Usuario"><input id="emp-pass" placeholder="Contraseña"><select id="emp-rol"><option value="empleado">Vendedor</option><option value="jefe">Jefe</option></select><button class="btn-verde" onclick="guardarEmpleadoDirecto()">Crear Empleado</button><div id="lista-empleados"></div></div><div id="balance-mes" class="card"></div><button onclick="borrarSesion()" style="background:var(--danger);color:#fff;margin-top:20px">🗑️ Borrar sesión</button></div>
<div id="mod-admin" class="modulo"><h3>👑 ADMIN</h3><div id="admin-stats"></div><div id="admin-tiendas"></div></div>
<div id="mod-balances-principal" class="modulo"><h3>📊 Balances</h3><div id="balances-content" class="card"></div></div>
<div id="modal-inv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;padding:16px"><h3 id="titulo-inv">Producto</h3><input id="inv-codigo" placeholder="Código"><input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" placeholder="Costo" oninput="this.value=formatearInput(this.value)"><input id="inv-publico" placeholder="Público" oninput="this.value=formatearInput(this.value)"><input id="inv-stock" type="number" placeholder="Stock"><div style="display:flex;gap:8px"><button class="btn-verde" onclick="guardarProducto()">Guardar</button><button onclick="cerrarModalInv()" style="background:var(--card2)">Cancelar</button></div></div>
<div id="modal-fiado" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;padding:16px"><h3>Cliente</h3><input id="fia-nombre" placeholder="Nombre"><input id="fia-codigo" placeholder="Código"><button class="btn-verde" onclick="guardarFiado()">Guardar</button><button onclick="cerrarModalFiado()" style="background:var(--card2)">Cancelar</button></div>
<div id="modal-gasto" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;padding:16px"><h3>Gasto</h3><input id="gas-que" placeholder="Qué"><input id="gas-precio" placeholder="Valor" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" onclick="guardarGasto()">Guardar</button><button onclick="cerrarModalGasto()" style="background:var(--card2)">Cancelar</button></div>
<div id="modal-compra" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:101;padding:16px"><h3>Compra</h3><input id="comp-empresa" placeholder="Empresa"><input id="comp-que" placeholder="Qué"><input id="comp-valor" placeholder="Valor" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" onclick="guardarCompra()">Guardar</button><button onclick="cerrarModalCompra()" style="background:var(--card2)">Cancelar</button></div>
<div id="modal-cobro" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:102;padding:16px"><h3>COBRAR</h3><select id="metodo" onchange="cambiarModoCobro()"><option value="efectivo">Efectivo</option><option value="credito">Fiado</option></select><div id="box-efectivo"><input id="paga-con" placeholder="Paga con..." oninput="this.value=formatearInput(this.value);calcVueltas()"><div id="vueltas" style="font-weight:900;color:var(--accent)"></div></div><div id="box-fiado" style="display:none"><input id="abono-fiado" placeholder="ABONO" oninput="this.value=formatearInput(this.value)"><div id="saldo-fiado"></div></div><button class="btn-verde" onclick="finalizarCobro()">FACTURAR <span id="consec-btn">POS:0001</span></button><button onclick="cerrarCobro()" style="background:var(--card2)">Cerrar</button></div>
<div id="nav"><button id="nav-facturas" onclick="verMod('facturas')">🧾<span>Facturas</span></button><button id="nav-fiado" onclick="verMod('fiado')">👥<span>Fiado</span></button><button id="nav-vender" onclick="verMod('vender')" class="ventas-centro">🛒<span>Ventas</span></button><button id="nav-inv" onclick="verMod('inventario')" style="display:none">📦<span>Inventario</span></button><button id="nav-gastos" onclick="verMod('gastos')">💸<span>Gastos</span></button><button id="nav-solicitudes" onclick="verMod('solicitudes')" style="display:none">📩<span>Solicitudes</span><span id="sol-badge" class="badge badge-pend" style="display:none">0</span></button><button id="nav-caja" onclick="verMod('caja')" style="display:none">💰<span>Cuadre</span></button><button id="nav-dashboard" onclick="verMod('admin')" style="display:none">📊<span>Dash</span></button><button id="nav-balances" onclick="verMod('balances-principal')" style="display:none">📈<span>Balances</span></button><button id="nav-notif" onclick="verMod('notificaciones')">🔔<span>Alertas</span><span id="nav-notif-badge" class="badge badge-notif" style="display:none">0</span></button></div><script>
function setTheme(t){localStorage.setItem('phraxys_theme',t);document.documentElement.setAttribute('data-theme',t);}
(function(){let th=localStorage.getItem('phraxys_theme')||'claro';document.documentElement.setAttribute('data-theme',th);})();
const firebaseConfig={apiKey:"AIzaSyAHGzYL9ZLiZqUgP7JrtqCndJebuSDWh3g",authDomain:"tienda-patia-v2.firebaseapp.com",databaseURL:"https://tienda-patia-v2-default-rtdb.firebaseio.com",projectId:"tienda-patia-v2",storageBucket:"tienda-patia-v2.firebasestorage.app",messagingSenderId:"318384915612",appId:"1:318384915612:web:7d15b36f6065e2bb645959"};firebase.initializeApp(firebaseConfig);const rtdb=firebase.database();
let rol=null;
function getStoreKey(base){let code="";try{code=(config&&config.storeCode?config.storeCode:"").toUpperCase()||(document.getElementById('login-user')?.value||'').toUpperCase()||'DEFAULT';}catch(e){code='DEFAULT';}if(rol==='admin')return base+'_ADMIN';return base+'_'+code;}
function safeGet(k,d){try{let key=getStoreKey(k);let v=localStorage.getItem(key);if(v)return JSON.parse(v);let v2=localStorage.getItem(k);if(v2)return JSON.parse(v2);return d;}catch(e){return d;}}
function safeSet(k,val){try{localStorage.setItem(getStoreKey(k),JSON.stringify(val));}catch(e){}}
let _old=null;try{_old=JSON.parse(localStorage.getItem('pos_config_DEFAULT')||localStorage.getItem('pos_config')||'null');}catch(e){}
if(!_old||!_old.storeCode)_old={pass_jefe:"1234",pass_admin:"ADMIN2026",storeCode:"",consec:1};
let config={pass_jefe:String(_old.pass_jefe||"1234").trim(),pass_admin:String(_old.pass_admin||"ADMIN2026").trim(),storeCode:(_old.storeCode||"").toUpperCase(),consec:Number(_old.consec||1)};
let usuarioActual=null,productos=[],fiados=[],ventas=[],gastos=[],compras=[],empleados=[],cajas=[],solicitudes=[],notificaciones=[],carrito=[],editIndex=-1,subGastos='gastos',filtroSol='pend';
function cargarDatosTienda(){productos=safeGet('pos_prod',[]);fiados=safeGet('pos_fiados',[{nombre:"Consumidor Final",codigo:"222222",deuda:0}]);ventas=safeGet('pos_ventas',[]);gastos=safeGet('pos_gastos',[]);compras=safeGet('pos_compras',[]);empleados=safeGet('pos_empleados',[]);cajas=safeGet('pos_cajas',[]);solicitudes=safeGet('pos_solicitudes',[]);notificaciones=safeGet('pos_notifs',[]);}
cargarDatosTienda();const $=id=>document.getElementById(id);const fmt=n=>"$ "+(Number(n)||0).toLocaleString('es-CO');const toNum=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
function formatearInput(v){let n=toNum(v);if(!n)return"";return n.toLocaleString('es-CO');}
function genConsec(){return "POS:"+String(config.consec).padStart(4,'0');}
function actualizarConsec(){if($('consecutivo'))$('consecutivo').innerText=genConsec();if($('consec-btn'))$('consec-btn').innerText=genConsec();}actualizarConsec();
function login(){let user=($('login-user').value||'').trim().toUpperCase();let pass=($('login-pass').value||'').trim();if(!user||!pass){alert('Pon usuario y clave');return;}if(user==='ADMIN'&&pass===config.pass_admin){rol='admin';usuarioActual={nombre:'ADMIN',rol:'admin'};$('login-screen').style.display='none';aplicarRol();return;}rtdb.ref('tiendas/'+user).once('value').then(snapT=>{let t=snapT.val();if(t){let pj=t.config.pass_jefe||'1234';let emps=t.empleados||[];let empEncontrado=emps.find(e=>e.pass===pass&&e.activo!==false);if(pass===pj){rol='jefe';usuarioActual={nombre:t.nombreTienda||user,usuario:user,rol:'jefe'};config=t.config;config.storeCode=user;cargarDatosTienda();$('login-screen').style.display='none';aplicarRol();conectarTienda();}else if(empEncontrado){rol=empEncontrado.rol||'empleado';usuarioActual={nombre:empEncontrado.nombre,usuario:empEncontrado.usuario,rol:rol};config=t.config;config.storeCode=user;cargarDatosTienda();$('login-screen').style.display='none';aplicarRol();conectarTienda();}else{alert('Clave mala');}}else{checkLocal(pass,user);}}).catch(()=>checkLocal(pass,user));}
function checkLocal(pass,user){let cfg=null;try{cfg=JSON.parse(localStorage.getItem('pos_config_'+user)||'null');}catch(e){}if(!cfg){alert('Usuario no existe');return;}config=cfg;config.storeCode=user;if(pass===config.pass_jefe){rol='jefe';usuarioActual={nombre:user,rol:'jefe'};}else{let emps=JSON.parse(localStorage.getItem('pos_empleados_'+user)||'[]');let emp=emps.find(e=>e.pass===pass);if(!emp){alert('Clave mala');return;}rol=emp.rol;usuarioActual={nombre:emp.nombre,rol:rol};}cargarDatosTienda();$('login-screen').style.display='none';aplicarRol();}
function logout(){rol=null;usuarioActual=null;$('login-screen').style.display='flex';}
function borrarSesion(){localStorage.clear();location.reload();}
function aplicarRol(){
  let esAdmin=rol==='admin';
  if(esAdmin){document.querySelectorAll('#nav button').forEach(b=>b.style.display='none');$('nav-dashboard').style.display='flex';$('nav-balances').style.display='flex';$('nav-notif').style.display='flex';document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo'));$('mod-admin').classList.add('activo');let btnTop=$('btn-ajustes-top');if(btnTop)btnTop.style.display='flex';return;}
  document.getElementById('nav').style.display='flex';document.querySelectorAll('#nav button').forEach(b=>b.style.display='none');
  $('nav-facturas').style.display='flex';$('nav-fiado').style.display='flex';$('nav-vender').style.display='flex';$('nav-gastos').style.display='flex';$('nav-notif').style.display='flex';
  let esJefe=rol==='jefe';
  if(esJefe){$('nav-inv').style.display='flex';$('nav-solicitudes').style.display='flex';}
  else{$('nav-caja').style.display='flex';}
  $('rol-label').innerText=esJefe?'JEFE '+config.storeCode:'EMP '+config.storeCode;
  if($('empleado-label'))$('empleado-label').innerText=usuarioActual?usuarioActual.nombre:'--';
  if($('empleado-label-top'))$('empleado-label-top').innerText=usuarioActual?usuarioActual.nombre:'--';
  let btnTop=$('btn-ajustes-top');if(btnTop)btnTop.style.display=esJefe?'flex':'none';
  verMod(esJefe?'inventario':'vender');actualizarBadges();
}
function actualizarBadges(){
  let pend=solicitudes.filter(s=>s.estado==='pend').length;
  if($('sol-pend'))$('sol-pend').innerText=pend+' pend';
  if($('sol-badge')){if(pend>0){$('sol-badge').style.display='inline';$('sol-badge').innerText=pend;}else $('sol-badge').style.display='none';}
  let notifPend=notificaciones.filter(n=>!n.leida).length;
  if($('nav-notif-badge')){if(notifPend>0){$('nav-notif-badge').style.display='inline';$('nav-notif-badge').innerText=notifPend;}else $('nav-notif-badge').style.display='none';}
  if($('notif-badge')){if(notifPend>0){$('notif-badge').style.display='flex';$('notif-badge').innerText=notifPend;}else $('notif-badge').style.display='none';}
}
function verMod(m){if(rol==='empleado'&&['ajustes','admin','inventario','balances-principal','solicitudes'].includes(m)){alert('Solo Jefe');m='vender';}document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo'));let mod=$('mod-'+m);if(mod)mod.classList.add('activo');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('activo-nav'));let nb=$('nav-'+m);if(nb)nb.classList.add('activo-nav');if(m==='inventario')renderInv();if(m==='fiado')renderFiado();if(m==='gastos')verSubGastos(subGastos);if(m==='facturas')renderFacturas();if(m==='solicitudes')renderSolicitudes();if(m==='notificaciones')renderNotifs();}
function filtrarSol(tipo){filtroSol=tipo;['sol-f-pend','sol-f-aprob','sol-f-rech'].forEach(id=>{let el=$(id);if(el){el.style.background='var(--card2)';el.style.color='var(--text)';}});let act=$(tipo==='pend'?'sol-f-pend':tipo==='aprob'?'sol-f-aprob':'sol-f-rech');if(act){act.style.background=tipo==='pend'?'var(--warning)':tipo==='aprob'?'var(--accent)':'var(--danger)';act.style.color=tipo==='pend'?'#000':'#fff';}renderSolicitudes();}
function renderSolicitudes(){
  actualizarBadges(); if(!$('lista-solicitudes'))return;
  let lista=solicitudes.filter(s=>{if(filtroSol==='pend')return s.estado==='pend';if(filtroSol==='aprob')return s.estado==='aprob';if(filtroSol==='rech')return s.estado==='rech';return true;});
  if(!lista.length){$('lista-solicitudes').innerHTML='<div class="card">📩 No hay solicitudes '+filtroSol+'</div>';return;}
  $('lista-solicitudes').innerHTML=lista.map(s=>{
    let i=solicitudes.indexOf(s);let color=s.estado==='pend'?'var(--warning)':s.estado==='aprob'?'var(--accent)':'var(--danger)';
    let botones='';if(rol==='jefe'&&s.estado==='pend'){botones='<div style="display:flex;gap:8px;margin-top:10px"><button onclick="aprobarSolicitud('+i+')" style="flex:1;background:var(--accent);color:#fff;font-weight:900;padding:10px;border:none;border-radius:10px">✅ ACEPTAR</button><button onclick="rechazarSolicitud('+i+')" style="flex:1;background:var(--danger);color:#fff;font-weight:900;padding:10px;border:none;border-radius:10px">❌ RECHAZAR</button></div>';}else if(s.estado!=='pend'){botones='<div style="margin-top:8px"><span style="background:'+color+';color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">'+s.estado.toUpperCase()+'</span> '+(s.resueltoPor?' por '+s.resueltoPor:'')+'</div>';}else{botones='<div style="margin-top:8px"><span style="background:var(--warning);color:#000;padding:4px 10px;border-radius:20px;font-size:11px">⏳ Pendiente jefe</span></div>';}
    return '<div class="card" style="border-left:5px solid '+color+'"><b>'+s.tipo+'</b> <small>'+new Date(s.fecha).toLocaleString()+'</small><br><b>'+s.quien+'</b>: '+s.detalle+botones+'</div>';
  }).join('');
}
function aprobarSolicitud(i){if(rol!=='jefe'){alert('Solo jefe');return;}let s=solicitudes[i];if(!s||s.estado!=='pend')return;s.estado='aprob';s.resueltoPor=usuarioActual.nombre;s.resueltoEn=Date.now();if(s.tipo==='GASTO'&&s.data){gastos.push({que:s.data.que,precio:s.data.precio,fecha:Date.now()});}notificaciones.push({tipo:'Aprobada',mensaje:s.tipo+' de '+s.quien+' aprobado',fecha:Date.now(),leida:false});saveAll();renderSolicitudes();renderGastos();alert('✅ Aprobada');}
function rechazarSolicitud(i){if(rol!=='jefe'){alert('Solo jefe');return;}let s=solicitudes[i];if(!s||s.estado!=='pend')return;s.estado='rech';s.resueltoPor=usuarioActual.nombre;s.resueltoEn=Date.now();notificaciones.push({tipo:'Rechazada',mensaje:s.tipo+' de '+s.quien+' rechazado',fecha:Date.now(),leida:false});saveAll();renderSolicitudes();alert('❌ Rechazada');}
function crearSolicitud(tipo,detalle,data){solicitudes.push({tipo,detalle,quien:usuarioActual?usuarioActual.nombre:'Empleado',fecha:Date.now(),estado:'pend',data:data||null});notificaciones.push({tipo:'Nueva solicitud',mensaje:tipo+' de '+(usuarioActual?usuarioActual.nombre:'Empleado')+': '+detalle,fecha:Date.now(),leida:false});saveAll();actualizarBadges();alert('📩 Solicitud enviada al jefe: '+tipo);}
function saveAll(){safeSet('pos_prod',productos);safeSet('pos_fiados',fiados);safeSet('pos_ventas',ventas);safeSet('pos_gastos',gastos);safeSet('pos_compras',compras);safeSet('pos_empleados',empleados);safeSet('pos_cajas',cajas);safeSet('pos_solicitudes',solicitudes);safeSet('pos_notifs',notificaciones);safeSet('pos_config',config);localStorage.setItem('pos_config_'+config.storeCode,JSON.stringify(config));if(config.storeCode&&rol!=='admin'){rtdb.ref('tiendas/'+config.storeCode).update({productos,fiados,ventas,gastos,compras,empleados,cajas,solicitudes,notificaciones,config,ultSync:Date.now()}).catch(()=>{});}}
function conectarTienda(){let code=config.storeCode;if(!code)return;rtdb.ref('tiendas/'+code).on('value',snap=>{let c=snap.val();if(!c)return;if(c.productos)productos=c.productos;if(c.solicitudes)solicitudes=c.solicitudes;if(c.gastos)gastos=c.gastos;if(c.ventas)ventas=c.ventas;if(c.notificaciones)notificaciones=c.notificaciones;renderSolicitudes();actualizarBadges();});}
function verSubGastos(t){subGastos=t;$('lista-gastos').style.display=t==='gastos'?'block':'none';$('lista-compras').style.display=t==='compras'?'block':'none';$('tab-gastos').style.background=t==='gastos'?'var(--warning)':'var(--card2)';$('tab-compras').style.background=t==='compras'?'var(--warning)':'var(--card2)';}
function cambiarModoCobro(){let m=$('metodo').value;$('box-efectivo').style.display=m==='efectivo'?'block':'none';$('box-fiado').style.display=m==='credito'?'block':'none';}
function buscarProducto(txt){let res=productos.filter(p=>p.nombre.toLowerCase().includes(txt.toLowerCase()));$('sugerencias').innerHTML=res.slice(0,5).map(r=>'<div class="card" onclick="addCarrito(productos.find(p=>p.codigo===\''+r.codigo+'\'))">'+r.nombre+' - '+fmt(r.publico)+'</div>').join('');}
function addCarrito(p){let ex=carrito.find(x=>x.codigo===p.codigo);if(ex)ex.cant++;else carrito.push({...p,cant:1,precio_final:p.publico});renderCarrito();}
function renderCarrito(){let tot=0;$('carrito').innerHTML=carrito.map((c,i)=>{let sub=c.precio_final*(c.cant||1);tot+=sub;return '<div class="card"><b>'+c.nombre+'</b> - '+fmt(c.precio_final)+' x '+c.cant+' = '+fmt(sub)+' <button onclick="carrito.splice('+i+',1);renderCarrito()">X</button></div>';}).join('');$('total').innerText="TOTAL: "+fmt(tot);}
function calcVueltas(){let paga=toNum($('paga-con').value);let tot=carrito.reduce((s,p)=>s+p.precio_final*(p.cant||1),0);if($('vueltas'))$('vueltas').innerText=paga? "Vueltas: "+fmt(paga-tot):"";}
function abrirModalInv(i){$('modal-inv').style.display='block';}function cerrarModalInv(){$('modal-inv').style.display='none';}
function guardarProducto(){let o={codigo:$('inv-codigo').value.trim().toUpperCase(),nombre:$('inv-nombre').value.trim(),costo:toNum($('inv-costo').value),publico:toNum($('inv-publico').value),stock:Number($('inv-stock').value||0),activo:true};if(!o.codigo)return;let ex=productos.findIndex(p=>p.codigo===o.codigo);if(ex>=0)productos[ex]=o;else productos.push(o);saveAll();cerrarModalInv();renderInv();}
function renderInv(){if(!$('lista-inv'))return;$('lista-inv').innerHTML=productos.map(p=>'<div class="card"><b>'+p.nombre+'</b> - '+fmt(p.publico)+' Stock:'+p.stock+'</div>').join('');}
function abrirModalFiado(){ $('modal-fiado').style.display='block';}function cerrarModalFiado(){ $('modal-fiado').style.display='none';}
function guardarFiado(){let n=$('fia-nombre').value.trim();if(!n)return;fiados.push({nombre:n,codigo:$('fia-codigo').value||n.slice(0,4).toUpperCase(),deuda:0});saveAll();cerrarModalFiado();renderFiado();}
function renderFiado(){if(!$('lista-fiado'))return;$('lista-fiado').innerHTML=fiados.map(f=>'<div class="card"><b>'+f.nombre+'</b> ('+f.codigo+')</div>').join('');}
function abrirModalGasto(){if(rol==='empleado'){let que=prompt('¿Qué gasto?');if(!que)return;let val=toNum(prompt('¿Valor?')||0);if(!val)return;crearSolicitud('GASTO',que+' por '+fmt(val),{que:que,precio:val});return;}$('modal-gasto').style.display='block';}
function cerrarModalGasto(){$('modal-gasto').style.display='none';}
function guardarGasto(){let obj={que:$('gas-que').value.trim(),precio:toNum($('gas-precio').value),fecha:Date.now()};if(!obj.que)return;gastos.push(obj);saveAll();cerrarModalGasto();renderGastos();}
function renderGastos(){if(!$('lista-gastos'))return;$('lista-gastos').innerHTML=gastos.slice().reverse().map(g=>'<div class="card"><b>'+g.que+'</b> - '+fmt(g.precio)+'</div>').join('');}
function abrirModalCompra(){$('modal-compra').style.display='block';}function cerrarModalCompra(){$('modal-compra').style.display='none';}
function guardarCompra(){let e=$('comp-empresa').value.trim();let q=$('comp-que').value.trim();let v=toNum($('comp-valor').value);compras.push({empresa:e,que:q,valor:v,fecha:Date.now()});saveAll();cerrarModalCompra();renderCompras();}
function renderCompras(){if(!$('lista-compras'))return;$('lista-compras').innerHTML=compras.slice().reverse().map(c=>'<div class="card"><b>'+c.empresa+'</b> - '+fmt(c.valor)+'</div>').join('');}
function guardarEmpleadoDirecto(){let n=$('emp-nombre').value.trim();let u=$('emp-usuario').value.trim()||n.split(' ')[0].toLowerCase();let p=$('emp-pass').value.trim();let r=$('emp-rol').value;empleados.push({nombre:n,usuario:u,pass:p,rol:r,activo:true});saveAll();renderEmpleados();}
function renderEmpleados(){let el=$('lista-empleados');if(!el)return;el.innerHTML=empleados.map(e=>'<div class="card"><b>'+e.nombre+'</b> - '+e.pass+'</div>').join('');}
function abrirCobro(t){if(!carrito.length){alert("Vacío");return;}$('metodo').value=t||'efectivo';cambiarModoCobro();$('modal-cobro').style.display='block';}
function cerrarCobro(){$('modal-cobro').style.display='none';}
function finalizarCobro(){let total=carrito.reduce((s,p)=>s+p.precio_final*(p.cant||1),0);ventas.push({total,fecha:Date.now(),productos:carrito,consec:genConsec()});config.consec++;saveAll();carrito=[];renderCarrito();cerrarCobro();alert('Venta OK');}
function renderNotifs(){if(!$('lista-notifs'))return;$('lista-notifs').innerHTML=notificaciones.slice().reverse().map(n=>'<div class="card"><b>'+n.tipo+'</b><br>'+n.mensaje+'</div>').join('')||'Sin notif';}
function renderFacturas(){if(!$('lista-facturas'))return;$('lista-facturas').innerHTML=ventas.slice().reverse().map(v=>'<div class="card"><b>'+v.consec+'</b> - '+fmt(v.total)+'</div>').join('');}
function toggleCam(){}filtrarSol('pend');verSubGastos('gastos');actualizarBadges();
</script>
</body>
</html>
