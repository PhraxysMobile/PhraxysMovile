<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Patia V1.3 FINAL</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding-bottom:90px}
.modulo{display:none;padding:12px}.activo{display:block!important}
.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 3px #ccc;position:relative}
.card.agotado{background:#e5e7eb!important;opacity:0.7}
.card.alerta-roja{border-left:6px solid #ef4444}
.card.alerta-naranja{border-left:6px solid #f59e0b}
input,button,select{font-size:16px;padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;margin:5px 0;box-sizing:border-box}
.btn-verde{background:#22c55e;color:#fff;font-weight:bold;border:none}
.btn-azul{background:#2563eb;color:#fff;border:none}
.btn-flotante{position:fixed;bottom:80px;right:16px;background:#111;color:#fff;border-radius:50px;padding:14px 18px;z-index:90;width:auto;font-weight:bold}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:80}
#nav button{flex:1;border:none;background:none;padding:10px 1px;font-size:10px;font-weight:700}
#reader-venta,#reader-inv{width:100%;display:none;border-radius:12px;overflow:hidden;background:#000}
.badge-vence{font-size:10px;padding:2px 6px;border-radius:10px;color:#fff}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:#111;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:28px">
<h1 style="color:#fff;text-align:center;margin:0">POS PATÍA V1.3</h1>
<p id="txt-claves" style="color:#666;text-align:center;font-size:11px">Cargando...</p>
<input id="login-pass" type="password" placeholder="Clave" style="font-size:24px;text-align:center">
<button class="btn-verde" onclick="login()">ENTRAR</button>
<button onclick="resetSoloClaves()" style="background:transparent;color:#444;border:1px dashed #333;margin-top:14px;font-size:10px">RESET SOLO CLAVES 1234/0000</button>
</div>
<div id="mod-vender" class="modulo">
<div style="display:flex;justify-content:space-between"><b id="rol-label" style="background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px"></b><span id="consecutivo" style="background:#2563eb;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">POS:0001</span><button onclick="logout()" style="width:auto;background:#000;color:#fff">Salir</button></div>
<div style="display:flex;gap:6px;margin-top:8px"><input id="search" placeholder="Buscar... (Quedan X)" oninput="buscarProducto(this.value)"><button style="width:60px;background:#111;color:#fff" onclick="toggleCam('venta')">📷</button></div>
<div id="reader-venta"></div><div id="sugerencias"></div><div id="carrito"></div>
<h2 id="total" style="text-align:right">TOTAL: $ 0</h2>
<button class="btn-verde" onclick="abrirCobro()">COBRAR</button>
<button onclick="cuadreCaja()" style="background:#fff;border:1px solid #000">📊 CUADRE HOY</button>
</div>
<div id="mod-inventario" class="modulo"><h3>Inventario <small id="alerta-vence"></small></h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv()">+ Producto</button></div>
<div id="mod-fiado" class="modulo"><h3>Fiados / Clientes</h3><div id="lista-fiado"></div><button id="btn-add-fiado" class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>
<div id="mod-gastos" class="modulo"><h3>Gastos</h3><div id="lista-gastos"></div><button class="btn-flotante" style="background:#f59e0b" onclick="abrirModalGasto()">+ Gasto</button></div>
<div id="mod-solic" class="modulo"><h3>📩 Buzón <span id="badge-solic"></span></h3><div id="lista-solic"></div><button class="btn-flotante" style="background:#7c3aed" onclick="abrirModalSolic()">+ Solicitud</button></div>
<div id="mod-ajustes" class="modulo"><h3>Tienda</h3><input id="cfg-nombre" placeholder="Nombre tienda"><input id="cfg-tel" placeholder="Tel"><button class="btn-azul" onclick="guardarCfgTienda()">Guardar Tienda</button><div class="card" style="background:#ede9fe;margin-top:12px"><h4 style="margin:0 0 6px">🔗 Multicelular</h4><div style="display:flex;gap:6px"><input id="cfg-store" placeholder="Código ej PATIA1" style="text-transform:uppercase"><button onclick="conectarTienda()" style="width:100px;background:#7c3aed;color:#fff">Conectar</button></div><small id="store-status"></small></div><div id="panel-jefe" class="card" style="background:#fef3c7;margin-top:12px"><h4>🔑 Jefe</h4><input id="cfg-pass-jefe" placeholder="Nueva clave Jefe"><input id="cfg-pass-emp" placeholder="Nueva clave Empleado"><input id="cfg-margen" type="number" placeholder="% margen"><input id="cfg-limite" type="number" placeholder="Límite fiado"><button class="btn-verde" onclick="guardarConfigJefe()">Guardar Config</button></div><div id="balance-mes" class="card"></div><div id="top3" class="card"></div><div class="card"><h4>⚠️ Por Vencer</h4><div id="lista-vence"></div></div></div>
<div id="modal-inv" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px;overflow:auto"><h3>Producto</h3><div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código"><button style="width:60px" onclick="toggleCam('inv')">📷</button></div><div id="reader-inv"></div><input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" placeholder="Costo ej 15.000" oninput="this.value=formatearInput(this.value)"><input id="inv-publico" placeholder="Público ej 20.000" oninput="this.value=formatearInput(this.value)"><input id="inv-stock" type="number" placeholder="Stock"><input id="inv-min" type="number" placeholder="Stock mínimo ej 3"><input id="inv-vence" type="date" placeholder="Vencimiento"><div id="panel-compra" style="display:none;background:#fef3c7;padding:10px;border-radius:10px;margin-top:6px"><b>Solo Jefe - Compra</b><input id="compra-cant" type="number" placeholder="Cantidad compra"><input id="compra-costo" placeholder="Costo compra" oninput="this.value=formatearInput(this.value)"><button style="background:#f59e0b" onclick="hacerCompra()">+ Stock y promedio</button></div><button class="btn-verde" onclick="guardarProducto()">Guardar</button><button onclick="cerrarModalInv()" style="background:#eee">Cancelar</button></div>
<div id="modal-fiado" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Nuevo Cliente</h3><input id="fia-nombre" placeholder="Nombre"><input id="fia-tel" placeholder="Tel"><input id="fia-codigo" placeholder="Código (222222 consumidor)"><input id="fia-deuda" placeholder="Deuda inicial" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" onclick="guardarFiado()">Guardar</button><button onclick="cerrarModalFiado()" style="background:#eee">Cancelar</button></div>
<div id="modal-gasto" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Gasto</h3><input id="gas-que" placeholder="Qué es?"><input id="gas-para" placeholder="Para qué?"><input id="gas-precio" placeholder="Valor" oninput="this.value=formatearInput(this.value)"><button class="btn-verde" style="background:#f59e0b" onclick="guardarGasto()">Guardar</button><button onclick="cerrarModalGasto()" style="background:#eee">Cancelar</button></div>
<div id="modal-solic" style="display:none;position:fixed;inset:0;background:#fff;z-index:100;padding:16px"><h3>Solicitud</h3><input id="sol-que" placeholder="Qué necesitas?"><input id="sol-para" placeholder="Para qué?"><button class="btn-verde" style="background:#7c3aed" onclick="guardarSolic()">Enviar</button><button onclick="cerrarModalSolic()" style="background:#eee">Cancelar</button></div>
<div id="modal-cobro" style="display:none;position:fixed;inset:0;background:#fff;z-index:101;padding:16px;overflow:auto">
<select id="metodo"><option value="efectivo">Efectivo</option><option value="credito">Fiado</option><option value="transferencia">Transferencia</option></select>
<input id="cliente-cobro" placeholder="Cliente - por defecto 222222"><div id="preview-cliente" style="font-weight:bold;color:#2563eb"></div>
<input id="paga-con" placeholder="Paga con" oninput="this.value=formatearInput(this.value);calcVueltas()"><div id="vueltas" style="font-weight:bold;color:#16a34a"></div>
<button class="btn-verde" onclick="finalizarCobro()">FACTURA</button>
<div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;border:1px dashed #000;margin-top:10px"><br><button class="btn-azul" onclick="compartirWA()">Compartir WhatsApp</button></div>
<button onclick="cerrarCobro()" style="background:#eee">Cerrar</button></div>
<div id="nav"><button onclick="verMod('vender')">Vender</button><button id="btn-nav-inv" onclick="verMod('inventario')">Inv</button><button onclick="verMod('fiado')">Fiado</button><button onclick="verMod('gastos')">Gastos</button><button onclick="verMod('solic')">Buzón</button><button id="btn-nav-ajustes" onclick="verMod('ajustes')">Ajustes</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAHGzYL9ZLiZqUgP7JrtqCndJebuSDWh3g",authDomain:"tienda-patia-v2.firebaseapp.com",databaseURL:"https://tienda-patia-v2-default-rtdb.firebaseio.com",projectId:"tienda-patia-v2",storageBucket:"tienda-patia-v2.firebasestorage.app",messagingSenderId:"318384915612",appId:"1:318384915612:web:7d15b36f6065e2bb645959"};firebase.initializeApp(firebaseConfig);const rtdb=firebase.database();
function safeGet(k,d){try{let v=localStorage.getItem(k);if(!v)return d;return JSON.parse(v);}catch(e){return d;}}
let _old=safeGet('pos_config',{pass_jefe:"1234",pass_empleado:"0000",margen_empleado:20,limite_fiado:50000,storeCode:"",consec:1});
let config={pass_jefe:String(_old.pass_jefe||"1234").trim(),pass_empleado:String(_old.pass_empleado||"0000").trim(),margen_empleado:Number(_old.margen_empleado||20),limite_fiado:Number(_old.limite_fiado||50000),storeCode:(_old.storeCode||"").toUpperCase(),consec:Number(_old.consec||1)};
let rol=null,productos=safeGet('pos_prod',[]),fiados=safeGet('pos_fiados',[{nombre:"Consumidor Final",codigo:"222222",telefono:"",deuda:0}]),ventas=safeGet('pos_ventas',[]),gastos=safeGet('pos_gastos',[]),solicitudes=safeGet('pos_solic',[]),carrito=[],html5QrCode=null,camAbierta=false,editIndex=-1,isSyncing=false;
const $=id=>document.getElementById(id);const fmt=n=>"$ "+(Number(n)||0).toLocaleString('es-CO');const toNum=v=>Number(String(v).replace(/[^0-9]/g,''))||0;
function formatearInput(v){let n=toNum(v);if(!n)return"";return n.toLocaleString('es-CO');}
function genConsec(){return "POS:"+String(config.consec).padStart(4,'0');}
$('txt-claves').innerText="Jefe:"+config.pass_jefe+" / Emp:"+config.pass_empleado+" | "+(config.storeCode||"sin tienda");
$('consecutivo').innerText=genConsec();
function resetSoloClaves(){if(confirm("Reset claves a 1234/0000?")){config.pass_jefe="1234";config.pass_empleado="0000";localStorage.setItem('pos_config',JSON.stringify(config));location.reload();}}
function login(){let p=($('login-pass').value||'').trim();if(p===config.pass_jefe)rol='jefe';else if(p===config.pass_empleado)rol='empleado';else{alert("Mala. Jefe:"+config.pass_jefe+" Emp:"+config.pass_empleado);return;}$('login-screen').style.display='none';$('rol-label').innerText="ROL:"+rol.toUpperCase();aplicarRol();}
function aplicarRol(){if(rol==='empleado'){$('btn-nav-inv').style.display='none';$('btn-nav-ajustes').style.display='none';$('btn-add-fiado').style.display='none';}else{$('btn-nav-inv').style.display='';$('btn-nav-ajustes').style.display='';$('btn-add-fiado').style.display='block';}verMod('vender');}
function logout(){rol=null;$('login-screen').style.display='flex';$('login-pass').value='';}
function saveAll(){localStorage.setItem('pos_prod',JSON.stringify(productos));localStorage.setItem('pos_fiados',JSON.stringify(fiados));localStorage.setItem('pos_ventas',JSON.stringify(ventas));localStorage.setItem('pos_gastos',JSON.stringify(gastos));localStorage.setItem('pos_solic',JSON.stringify(solicitudes));localStorage.setItem('pos_config',JSON.stringify(config));localStorage.setItem('tienda_nombre',$('cfg-nombre').value);localStorage.setItem('tienda_tel',$('cfg-tel').value);if(config.storeCode){isSyncing=true;rtdb.ref('tiendas/'+config.storeCode).set({productos,fiados,ventas,gastos,solicitudes,config}).then(()=>isSyncing=false).catch(()=>isSyncing=false);}}
function conectarTienda(){let code=$('cfg-store').value.trim().toUpperCase();if(code.length<3){alert("Codigo ej PATIA1");return;}config.storeCode=code;saveAll();$('store-status').innerText="Conectando...";rtdb.ref('tiendas/'+code).on('value',snap=>{if(isSyncing)return;let c=snap.val();if(c){if(c.productos)productos=c.productos;if(c.fiados)fiados=c.fiados;if(c.ventas)ventas=c.ventas;if(c.gastos)gastos=c.gastos;if(c.solicitudes)solicitudes=c.solicitudes;saveAll();renderInv();renderFiado();renderGastos();renderSolic();renderBalance();$('store-status').innerText="Sincronizado "+code+" ✅ "+new Date().toLocaleTimeString();}else{rtdb.ref('tiendas/'+code).set({productos,fiados,ventas,gastos,solicitudes,config});$('store-status').innerText="Creada "+code+" ✅";}});}
if(config.storeCode){$('cfg-store').value=config.storeCode;conectarTienda();}
async function toggleCam(t){let id=t==='venta'?'reader-venta':'reader-inv';let el=$(id);if(camAbierta){try{await html5QrCode.stop();html5QrCode.clear();}catch(e){}el.style.display='none';camAbierta=false;return;}el.style.display='block';html5QrCode=new Html5Qrcode(id);camAbierta=true;html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:100}},d=>{if(t==='venta')buscarProducto(d,true);else $('inv-codigo').value=d;toggleCam(t);}).catch(()=>{camAbierta=false;});}
function diasParaVencer(f){if(!f)return 9999;let hoy=new Date();let v=new Date(f);let diff=(v-hoy)/(1000*60*60*24);return Math.ceil(diff);}
  function buscarProducto(txt,esCod){if(!txt){$('sugerencias').innerHTML='';return;}let res=productos.filter(p=>esCod?p.codigo===txt:p.nombre.toLowerCase().includes(txt.toLowerCase()));if(esCod&&res[0]){addCarrito(res[0]);$('search').value='';$('sugerencias').innerHTML='';return;}$('sugerencias').innerHTML=res.slice(0,5).map(r=>{let d=diasParaVencer(r.vence);let bv=d<=15?'<span class=badge-vence style=background:#ef4444>VENCE '+d+'d</span>':d<=90?'<span class=badge-vence style=background:#f59e0b>Vence '+d+'d</span>':'';return `<div class="card" onclick="addCarrito(productos.find(p=>p.codigo==='${r.codigo}'))"><b>${r.nombre}</b> - ${fmt(r.publico)} <small>Quedan ${r.stock} u</small> ${bv}</div>`}).join('');}
function addCarrito(p){if(p.stock<=0){solicitudes.push({que:`VENDIDO EN NEGATIVO ${p.nombre} stock ${p.stock}`,para:"Reponer",fecha:Date.now(),quien:rol||'sistema',estado:'pendiente'});}let ex=carrito.find(x=>x.codigo===p.codigo);if(ex){ex.cant=(ex.cant||1)+1}else{carrito.push({...p,cant:1,precio_final:p.publico});}renderCarrito();}
function renderCarrito(){let tot=0;$('carrito').innerHTML=carrito.map((c,i)=>{let sub=Number(c.precio_final)*(c.cant||1);tot+=sub;let min=Number(c.costo)+Number(c.costo)*config.margen_empleado/100;return `<div class="card"><b>${c.nombre}</b> x${c.cant} <small>Min:${fmt(min)}</small><br><div style=display:flex;gap:6px><button style=width:30px onclick="carrito[${i}].cant=Math.max(1,carrito[${i}].cant-1);renderCarrito()">-</button><input value="${fmt(c.precio_final).replace('$ ','')}" oninput="validarPrecio(${i},this.value)" style=width:60%><button style=width:30px onclick="carrito[${i}].cant++;renderCarrito()">+</button><button onclick="carrito.splice(${i},1);renderCarrito()" style="width:28%;background:#fee">X</button></div><small>${fmt(sub)}</small></div>`;}).join('');$('total').innerText="TOTAL: "+fmt(tot);}
function validarPrecio(i,v){let min=Number(carrito[i].costo)+Number(carrito[i].costo)*config.margen_empleado/100;let num=toNum(v);if(rol==='empleado'&&num<min){alert("Min "+fmt(min));num=min;}carrito[i].precio_final=num;renderCarrito();}
function calcVueltas(){let paga=toNum($('paga-con').value);let tot=carrito.reduce((s,p)=>s+Number(p.precio_final)*(p.cant||1),0);let vue=paga-tot;$('vueltas').innerText=vue>=0?"Vueltas: "+fmt(vue):"Falta: "+fmt(Math.abs(vue));}
function verMod(m){try{html5QrCode?.stop();}catch(e){}document.querySelectorAll('[id^="reader-"]').forEach(e=>e.style.display='none');camAbierta=false;document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo'));$('mod-'+m).classList.add('activo');if(m==='inventario')renderInv();if(m==='fiado')renderFiado();if(m==='gastos')renderGastos();if(m==='solic')renderSolic();if(m==='ajustes')renderBalance();}
function abrirModalInv(i=-1){editIndex=i;$('modal-inv').style.display='block';$('panel-compra').style.display=rol==='jefe'?'block':'none';if(i>=0){let p=productos[i];$('inv-codigo').value=p.codigo;$('inv-nombre').value=p.nombre;$('inv-costo').value=fmt(p.costo).replace('$ ','');$('inv-publico').value=fmt(p.publico).replace('$ ','');$('inv-stock').value=p.stock;$('inv-min').value=p.min||3;$('inv-vence').value=p.vence||'';}else{$('inv-codigo').value='';$('inv-nombre').value='';$('inv-costo').value='';$('inv-publico').value='';$('inv-stock').value='';$('inv-min').value='3';$('inv-vence').value='';}}function cerrarModalInv(){$('modal-inv').style.display='none';}
function hacerCompra(){if(rol!=='jefe'){alert("Solo jefe");return;}let cant=Number($('compra-cant').value||0);let costo=toNum($('compra-costo').value);if(editIndex>=0&&cant>0){let p=productos[editIndex];let totalStock=(p.stock||0)+cant;let costoProm=((p.costo||0)*(p.stock||0)+costo*cant)/totalStock;p.costo=Math.round(costoProm);p.stock=totalStock;if($('inv-vence').value)p.vence=$('inv-vence').value;saveAll();alert("Stock ahora "+p.stock+" costo promedio "+fmt(p.costo));}}
function guardarProducto(){let o={codigo:$('inv-codigo').value.trim(),nombre:$('inv-nombre').value.trim(),costo:toNum($('inv-costo').value),publico:toNum($('inv-publico').value),stock:Number($('inv-stock').value||0),min:Number($('inv-min').value||3),vence:$('inv-vence').value||''};if(!o.codigo||!o.nombre)return;if(editIndex>=0)productos[editIndex]={...productos[editIndex],...o};else productos.push(o);saveAll();cerrarModalInv();renderInv();}
function renderInv(){let html=productos.map((p,i)=>{let clase=p.stock<=0?' agotado':(p.stock<=(p.min||3)?' alerta-roja':'');let d=diasParaVencer(p.vence);let bv=d<=15?`<span class=badge-vence style=background:#ef4444>ROJO ${d}d</span>`:d<=90?`<span class=badge-vence style=background:#f59e0b>NARANJA ${d}d</span>`:'';return `<div class="card${clase}"><b>${p.nombre}</b> ${bv}<br><span onclick="editarCampo(${i},'publico')" style=background:#fef08a;padding:4px 8px;border-radius:8px;cursor:pointer>${fmt(p.publico)} ✏️</span> <span onclick="editarCampo(${i},'stock')" style=background:#bbf7d0;padding:4px 8px;border-radius:8px;cursor:pointer>Stock:${p.stock} ✏️</span><br><small>${p.codigo} | Min:${p.min||3} | ${p.vence||'sin vence'} | Quedan ${p.stock} u | vigencia 30d</small><br><span onclick="abrirModalInv(${i})">✏️ Editar completo</span></div>`}).join('');$('lista-inv').innerHTML=html||'Vacio';renderVence();}
function editarCampo(i,campo){let p=productos[i];let val=prompt("Nuevo "+campo, campo==='publico'?p.publico:p.stock);if(val==null)return;if(campo==='publico')p.publico=toNum(val);else p.stock=Number(val);saveAll();renderInv();}
function renderVence(){let list=productos.filter(p=>p.vence&&diasParaVencer(p.vence)<=90).sort((a,b)=>diasParaVencer(a.vence)-diasParaVencer(b.vence));$('lista-vence').innerHTML=list.map(p=>`<div><b>${p.nombre}</b> - ${p.vence} (${diasParaVencer(p.vence)} días) ${diasParaVencer(p.vence)<=15?'🔴':'🟠'}</div>`).join('')||'Todo bien';$('alerta-vence').innerText=list.length?`⚠️ ${list.length} por vencer`:'';}
function abrirModalFiado(){$('modal-fiado').style.display='block';$('fia-codigo').value='';}function cerrarModalFiado(){$('modal-fiado').style.display='none';}
function guardarFiado(){let n=$('fia-nombre').value.trim();if(!n)return;let code=($('fia-codigo').value.trim()||n.slice(0,3).toUpperCase()||"222222");fiados.push({nombre:n,telefono:$('fia-tel').value,codigo:code,deuda:toNum($('fia-deuda').value)});saveAll();cerrarModalFiado();renderFiado();}
function renderFiado(){$('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b>${f.nombre}</b> (${f.codigo})<br>Debe: ${fmt(f.deuda)}<br><button onclick="abonar(${i})" style="width:48%">Abono</button><button style="width:48%" onclick="verDeuda(${i})">Ver</button></div>`).join('')||'Sin fiados';}
function abonar(i){let m=toNum(prompt("Abono ej 10.000")||0);if(m>0){fiados[i].deuda=Math.max(0,fiados[i].deuda-m);saveAll();renderFiado();}}function verDeuda(i){alert(fiados[i].nombre+" debe "+fmt(fiados[i].deuda));}
function abrirModalGasto(){$('modal-gasto').style.display='block';}function cerrarModalGasto(){$('modal-gasto').style.display='none';}
function guardarGasto(){let que=$('gas-que').value.trim();let para=$('gas-para').value.trim();let pr=toNum($('gas-precio').value);if(!que||!pr)return;gastos.push({que,para,precio:pr,fecha:Date.now(),quien:rol});saveAll();cerrarModalGasto();renderGastos();}
function renderGastos(){$('lista-gastos').innerHTML=gastos.slice().reverse().map(g=>`<div class="card"><b>${g.que}</b> - ${fmt(g.precio)}<br><small>${g.para} | ${new Date(g.fecha).toLocaleString()} | ${g.quien}</small></div>`).join('')||'Sin gastos';}
function abrirModalSolic(){$('modal-solic').style.display='block';}function cerrarModalSolic(){$('modal-solic').style.display='none';}
function guardarSolic(){let que=$('sol-que').value.trim();let para=$('sol-para').value.trim();if(!que)return;solicitudes.push({que,para,fecha:Date.now(),quien:rol,estado:'pendiente'});saveAll();cerrarModalSolic();renderSolic();}
function renderSolic(){let pend=solicitudes.filter(s=>s.estado==='pendiente').length;$('badge-solic').innerText=pend?pend+" pendientes":"";$('lista-solic').innerHTML=solicitudes.slice().reverse().map((s,idx)=>`<div class="card" style="border-left:4px solid ${s.estado==='pendiente'?'orange':'green'}"><b>${s.que}</b> - ${s.estado}<br><small>${s.para} | ${new Date(s.fecha).toLocaleString()} | ${s.quien}</small><br>${rol==='jefe'&&s.estado==='pendiente'?`<button onclick="solicitudes[${solicitudes.length-1-idx}].estado='aprobado';saveAll();renderSolic()" style="width:48%">Aprobar</button><button onclick="solicitudes[${solicitudes.length-1-idx}].estado='rechazado';saveAll();renderSolic()" style="width:48%;background:#fee">Rechazar</button>`:''}</div>`).join('')||'Sin solicitudes';}
function abrirCobro(){if(!carrito.length)return;let cliente=fiados.find(f=>f.codigo==="222222")||fiados[0];$('cliente-cobro').value=cliente?cliente.codigo+" - "+cliente.nombre:"222222 - Consumidor Final";$('modal-cobro').style.display='block';$('bloque-factura').style.display='none';calcVueltas();}function cerrarCobro(){$('modal-cobro').style.display='none';}
function finalizarCobro(){let met=$('metodo').value;let cliTxt=$('cliente-cobro').value.trim();let cliente=fiados.find(f=>cliTxt.includes(f.codigo))||fiados.find(f=>f.codigo==="222222");let total=carrito.reduce((s,p)=>s+Number(p.precio_final)*(p.cant||1),0);if(met==='credito'&&cliente){cliente.deuda+=total;}let vigencia=new Date();vigencia.setDate(vigencia.getDate()+30);let c=$('canvas-factura');c.width=384;c.height=600;let ctx=c.getContext('2d');ctx.fillStyle="#fff";ctx.fillRect(0,0,384,600);ctx.fillStyle="#000";ctx.font="12px monospace";let y=20;ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA PATIA').slice(0,32),10,y);y+=14;ctx.fillText(genConsec()+" | "+new Date().toLocaleString(),10,y);y+=14;ctx.fillText("Cliente: "+(cliente?cliente.nombre:"Consumidor Final"),10,y);y+=14;ctx.fillText("Vigencia: "+vigencia.toLocaleDateString()+" (30 días)",10,y);y+=10;ctx.fillText("-------------------------------",10,y);carrito.forEach(p=>{y+=14;ctx.fillText((p.nombre.slice(0,20)+" x"+p.cant+" "+fmt(p.precio_final*(p.cant||1))).slice(0,36),10,y);});y+=20;ctx.font="bold 14px monospace";ctx.fillText("TOTAL: "+fmt(total)+" "+met,10,y);$('img-factura').src=c.toDataURL();$('bloque-factura').style.display='block';ventas.push({total,fecha:Date.now(),productos:carrito,consec:genConsec(),cliente:cliente?cliente.codigo:"222222",vigencia:vigencia.toISOString()});config.consec++;saveAll();$('consecutivo').innerText=genConsec();carrito.forEach(v=>{let pr=productos.find(p=>p.codigo===v.codigo);if(pr)pr.stock-=v.cant||1;});saveAll();carrito=[];renderCarrito();renderInv();}
function compartirWA(){let img=$('img-factura').src;if(navigator.share){fetch(img).then(r=>r.blob()).then(b=>{let f=new File([b],"factura.png",{type:"image/png"});navigator.share({files:[f],title:"Factura "+genConsec()});});}else{window.open("https://wa.me/?text="+encodeURIComponent("Factura "+genConsec()),"_blank");}}
function guardarCfgTienda(){saveAll();alert("Guardado");}
function guardarConfigJefe(){if(rol!=='jefe')return;if($('cfg-pass-jefe').value)config.pass_jefe=$('cfg-pass-jefe').value.trim();if($('cfg-pass-emp').value)config.pass_empleado=$('cfg-pass-emp').value.trim();if($('cfg-margen').value)config.margen_empleado=Number($('cfg-margen').value);if($('cfg-limite').value)config.limite_fiado=toNum($('cfg-limite').value);if($('cfg-store').value)config.storeCode=$('cfg-store').value.trim().toUpperCase();saveAll();alert("Guardado");}
function renderBalance(){let mes=ventas.filter(v=>v.fecha>Date.now()-2592000000);let tot=mes.reduce((s,v)=>s+Number(v.total),0);let gMes=gastos.filter(g=>g.fecha>Date.now()-2592000000).reduce((s,g)=>s+Number(g.precio),0);$('balance-mes').innerHTML="Ventas 30d: "+fmt(tot)+"<br>Gastos: "+fmt(gMes)+"<br>Neto: "+fmt(tot-gMes)+"<br>Facturas: "+mes.length;}
function cuadreCaja(){let hoyV=ventas.filter(v=>new Date(v.fecha).toDateString()==new Date().toDateString());let tv=hoyV.reduce((s,v)=>s+Number(v.total),0);let hoyG=gastos.filter(g=>new Date(g.fecha).toDateString()==new Date().toDateString());let tg=hoyG.reduce((s,g)=>s+Number(g.precio),0);alert("CUADRE HOY\nVentas: "+fmt(tv)+"\nGastos: "+fmt(tg)+"\nNeto: "+fmt(tv-tg)+"\nFacturas hoy: "+hoyV.length);}
$('cliente-cobro').addEventListener('input',e=>{let t=e.target.value.toLowerCase();let f=fiados.find(x=>x.nombre.toLowerCase().includes(t)||x.codigo.toLowerCase().includes(t));$('preview-cliente').innerText=f?f.nombre+" debe "+fmt(f.deuda):"";});
$('cfg-nombre').value=localStorage.getItem('tienda_nombre')||'';$('cfg-tel').value=localStorage.getItem('tienda_tel')||'';$('cfg-store').value=config.storeCode||'';
if(!fiados.find(f=>f.codigo==="222222")){fiados.unshift({nombre:"Consumidor Final",codigo:"222222",telefono:"",deuda:0});saveAll();}
renderInv();renderFiado();renderGastos();renderSolic();renderBalance();
</script>
</body>
</html>
