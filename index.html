<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS Patia V1.0</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding-bottom:90px}
.modulo{display:none;padding:15px}.activo{display:block}
.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 3px #ccc;position:relative}
input,button,select{font-size:18px;padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;margin:6px 0;box-sizing:border-box}
.btn-verde{background:#22c55e;color:#fff;font-weight:bold;border:none}
.btn-azul{background:#2563eb;color:#fff;border:none}
.btn-flotante{position:fixed;bottom:75px;right:20px;background:#2563eb;color:#fff;border-radius:50px;padding:16px 22px;z-index:99;width:auto;font-weight:bold}
#nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;z-index:50}
#nav button{flex:1;border:none;background:none;padding:14px 0}
#reader-venta,#reader-inv{width:100%;display:none;border-radius:12px;overflow:hidden}
#btn-flash-venta,#btn-flash-inv{display:none;width:100%;background:#333;color:#fff}
.lapiz{position:absolute;right:10px;top:10px;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<!-- VENDER -->
<div id="mod-vender" class="modulo activo">
  <div style="display:flex;gap:6px"><input id="search" placeholder="Buscar producto o código..." oninput="buscarProducto(this.value)"><button style="width:65px" onclick="toggleCam('venta')">📷</button></div>
  <button id="btn-flash-venta" onclick="toggleFlash()">🔦 Flash</button><div id="reader-venta"></div>
  <div id="sugerencias"></div><div id="carrito"></div>
  <h2 id="total">TOTAL: $ 0</h2>
  <button class="btn-verde" onclick="abrirCobro()">COBRAR</button>
  <button onclick="cuadreCaja()" style="background:#e5e7eb">📊 CUADRE DE CAJA DIARIO</button>
</div>

<!-- INVENTARIO -->
<div id="mod-inventario" class="modulo"><h3>Inventario</h3><div id="lista-inv"></div><button class="btn-flotante" onclick="abrirModalInv()">+ Producto</button></div>

<!-- FIADO -->
<div id="mod-fiado" class="modulo"><h3>Fiados</h3><div id="lista-fiado"></div><button class="btn-flotante" onclick="abrirModalFiado()">+ Persona</button></div>

<!-- AJUSTES -->
<div id="mod-ajustes" class="modulo">
  <h3>Ajustes Tienda</h3><input id="cfg-nombre" placeholder="Nombre tienda"><input id="cfg-tel" placeholder="Teléfono"><button class="btn-azul" onclick="guardarCfg()">Guardar</button>
  <hr><h3>Balance 30 días</h3><div id="balance-mes" class="card"></div><h3>Top 3 más vendidos</h3><div id="top3" class="card"></div>
</div>

<!-- MODAL PRODUCTO -->
<div id="modal-inv" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:100;padding:20px;overflow:auto">
  <h3 id="titulo-inv">Agregar Producto</h3>
  <div style="display:flex;gap:6px"><input id="inv-codigo" placeholder="Código barras"><button style="width:65px" onclick="toggleCam('inv')">📷</button></div>
  <button id="btn-flash-inv" onclick="toggleFlash()">🔦 Flash</button><div id="reader-inv"></div>
  <input id="inv-nombre" placeholder="Nombre"><input id="inv-costo" type="number" placeholder="Precio costo (lo que te queda)"><input id="inv-publico" type="number" placeholder="Precio público"><input id="inv-stock" type="number" placeholder="Existencias">
  <button class="btn-verde" onclick="guardarProducto()">Guardar en Inventario</button><button onclick="cerrarModalInv()">Salir</button>
</div>

<!-- MODAL FIADO -->
<div id="modal-fiado" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:100;padding:20px;overflow:auto">
  <h3>Persona</h3><input id="fia-nombre" placeholder="Nombre"><input id="fia-tel" placeholder="Teléfono"><input id="fia-codigo" placeholder="Código corto ej: 01"><input id="fia-deuda" type="number" placeholder="Deuda inicial" value="0">
  <button class="btn-verde" onclick="guardarFiado()">Guardar Persona</button><button onclick="cerrarModalFiado()">Salir</button>
</div>

<!-- MODAL COBRO -->
<div id="modal-cobro" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:101;padding:20px;overflow:auto">
  <h3>Método de Pago</h3><select id="metodo"><option value="efectivo">Efectivo</option><option value="credito">Crédito / Fiado</option><option value="transferencia">Transferencia</option></select>
  <input id="cliente-cobro" placeholder="Nombre o código fiado (si es fiado)"><div id="preview-cliente" style="font-weight:bold;color:#2563eb"></div>
  <button class="btn-verde" onclick="finalizarCobro()">Generar Factura (Imagen)</button>
  <div id="bloque-factura" style="display:none"><canvas id="canvas-factura" style="display:none"></canvas><img id="img-factura" style="width:100%;margin-top:12px;border:1px dashed #000"><button class="btn-azul" onclick="compartirWhatsapp()">Enviar por WhatsApp</button><button onclick="imprimirImagen()">Imprimir</button></div>
  <button onclick="cerrarCobro()" style="margin-top:15px;background:#eee">Cerrar</button>
</div>

<div id="nav"><button onclick="verMod('vender')">Vender</button><button onclick="verMod('inventario')">Inventario</button><button onclick="verMod('fiado')">Fiado</button><button onclick="verMod('ajustes')">Ajustes</button></div>

<script>
let productos=JSON.parse(localStorage.getItem('pos_prod')||'[]');
let fiados=JSON.parse(localStorage.getItem('pos_fiados')||'[]');
let ventas=JSON.parse(localStorage.getItem('pos_ventas')||'[]');
let carrito=[]; let html5QrCode=null; let camAbierta=false; let editIndex=-1;
const fmt=n=>"$ "+Number(n||0).toLocaleString('es-CO');
const $=id=>document.getElementById(id);

// CAMARA SOLO BARRAS
async function toggleCam(tipo){
  const idR=tipo==='venta'?'reader-venta':'reader-inv'; const idF=tipo==='venta'?'btn-flash-venta':'btn-flash-inv';
  const elR=$(idR); const elF=$(idF);
  if(camAbierta){try{await html5QrCode.stop();html5QrCode.clear();}catch(e){} elR.style.display='none';elF.style.display='none';camAbierta=false;return;}
  elR.style.display='block';elF.style.display='block'; html5QrCode=new Html5Qrcode(idR); camAbierta=true;
  html5QrCode.start({facingMode:"environment"},{fps:15,qrbox:{width:280,height:100},experimentalFeatures:{useBarCodeDetectorIfSupported:true},formatsToSupport:[0,1,2,3,9]},(dec)=>{
    if(tipo==='venta') buscarProducto(dec,true); else $('inv-codigo').value=dec; toggleCam(tipo);
  }).catch(e=>{camAbierta=false; alert("Cámara no disponible: "+e)});
}
function toggleFlash(){ try{html5QrCode.getRunningTrackCameraCapabilities().torchFeature().apply(true);}catch(e){} }

// VENDER
function buscarProducto(txt,esCod=false){
  if(!txt){$('sugerencias').innerHTML='';return;}
  let res=productos.filter(p=>esCod? p.codigo==txt : p.nombre.toLowerCase().includes(txt.toLowerCase())||p.codigo.includes(txt));
  if(esCod&&res[0]){addCarrito(res[0]); $('search').value=''; $('sugerencias').innerHTML='';}
  else{$('sugerencias').innerHTML=res.slice(0,5).map(r=>`<div class="card" onclick="addCarrito(productos.find(p=>p.codigo=='${r.codigo}'))">${r.nombre} - ${fmt(r.publico)} - Stock:${r.stock}</div>`).join('');}
}
function addCarrito(p){ carrito.push({...p,precio_final:p.publico,stock:p.stock}); renderCarrito(); }
function renderCarrito(){
  let tot=0; $('carrito').innerHTML=carrito.map((c,i)=>{tot+=Number(c.precio_final); return `<div class="card"><b>${c.nombre}</b> <small>Existencias: ${c.stock}</small><br><input type="number" value="${c.precio_final}" onchange="carrito[${i}].precio_final=this.value;renderCarrito()" style="width:130px"> ${fmt(c.precio_final)} <button onclick="carrito.splice(${i},1);renderCarrito()" style="width:auto;background:#fee">X</button></div>`}).join('');
  $('total').innerText="TOTAL: "+fmt(tot);
}

// NAV
function verMod(m){
  try{html5QrCode?.stop();}catch(e){} document.querySelectorAll('[id^="reader-"]').forEach(e=>e.style.display='none'); document.querySelectorAll('[id^="btn-flash"]').forEach(e=>e.style.display='none'); camAbierta=false;
  document.querySelectorAll('.modulo').forEach(d=>d.classList.remove('activo')); $('mod-'+m).classList.add('activo');
  if(m=='inventario') renderInv(); if(m=='fiado') renderFiado(); if(m=='ajustes') renderBalance();
}

// INVENTARIO CRUD
function abrirModalInv(i=-1){ editIndex=i; $('modal-inv').style.display='block'; if(i>=0){let p=productos[i]; $('inv-codigo').value=p.codigo;$('inv-nombre').value=p.nombre;$('inv-costo').value=p.costo;$('inv-publico').value=p.publico;$('inv-stock').value=p.stock;$('titulo-inv').innerText='Editar Producto';}else{$('inv-codigo').value='';$('inv-nombre').value='';$('inv-costo').value='';$('inv-publico').value='';$('inv-stock').value='';$('titulo-inv').innerText='Agregar Producto';}}
function cerrarModalInv(){ $('modal-inv').style.display='none'; editIndex=-1; }
function guardarProducto(){
  let o={codigo:$('inv-codigo').value.trim(),nombre:$('inv-nombre').value.trim(),costo:Number($('inv-costo').value||0),publico:Number($('inv-publico').value||0),stock:Number($('inv-stock').value||0)};
  if(!o.codigo||!o.nombre){alert("Falta código y nombre");return;}
  if(editIndex>=0) productos[editIndex]=o; else productos.push(o);
  localStorage.setItem('pos_prod',JSON.stringify(productos)); cerrarModalInv(); renderInv();
}
function renderInv(){ $('lista-inv').innerHTML=productos.map((p,i)=>`<div class="card"><b>${p.nombre}</b><br>${fmt(p.publico)} - Stock: ${p.stock}<br><small>${p.codigo} | Costo: ${fmt(p.costo)}</small><span class="lapiz" onclick="abrirModalInv(${i})">✏️</span></div>`).join('')||'Vacío'; }

// FIADO CRUD
function abrirModalFiado(){ $('modal-fiado').style.display='block'; $('fia-nombre').value='';$('fia-tel').value='';$('fia-codigo').value='';$('fia-deuda').value='0'; }
function cerrarModalFiado(){ $('modal-fiado').style.display='none'; }
function guardarFiado(){ let n=$('fia-nombre').value.trim(); if(!n){alert("Falta nombre");return;} fiados.push({nombre:n,telefono:$('fia-tel').value,codigo:$('fia-codigo').value.trim()||n.substring(0,2).toUpperCase(),deuda:Number($('fia-deuda').value||0),historial:[]}); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); cerrarModalFiado(); renderFiado(); }
function renderFiado(){ $('lista-fiado').innerHTML=fiados.map((f,i)=>`<div class="card"><b>${f.nombre}</b> (${f.codigo})<br>Debe: ${fmt(f.deuda)}<br><small>${f.telefono}</small><br><button onclick="abonar(${i})" style="width:48%">Abono</button><button onclick="verCuenta(${i})" style="width:48%">Cuenta</button></div>`).join('')||'Sin deudores'; }
function abonar(i){ let m=Number(prompt("¿Cuánto abona?")||0); if(m>0){fiados[i].deuda-=m; fiados[i].historial.push({tipo:'abono',monto:m,fecha:Date.now()}); localStorage.setItem('pos_fiados',JSON.stringify(fiados)); renderFiado(); alert("Nuevo saldo: "+fmt(fiados[i].deuda));}}
function verCuenta(i){ let f=fiados[i]; alert(`Cuenta ${f.nombre}\nDeuda: ${fmt(f.deuda)}\nHistorial: ${f.historial.length} movs`); }

// COBRO + FACTURA IMAGEN 58MM
function abrirCobro(){ if(carrito.length==0){alert("Carrito vacío");return;} $('modal-cobro').style.display='block'; $('bloque-factura').style.display='none'; }
function cerrarCobro(){ $('modal-cobro').style.display='none'; }
function finalizarCobro(){
  const metodo=$('metodo').value; const cli=$('cliente-cobro').value.trim(); let cliObj=null;
  if(metodo==='credito'&&cli){cliObj=fiados.find(f=>f.codigo.toLowerCase()==cli.toLowerCase()||f.nombre.toLowerCase().includes(cli.toLowerCase())); if(!cliObj){alert("Cliente fiado no encontrado");return;} cliObj.deuda+=carrito.reduce((s,p)=>s+Number(p.precio_final),0); cliObj.historial.push({tipo:'fiado',monto:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now()}); localStorage.setItem('pos_fiados',JSON.stringify(fiados));}
  // GENERAR IMAGEN
  const canvas=$('canvas-factura'); canvas.width=384; canvas.height=700; const ctx=canvas.getContext('2d');
  ctx.fillStyle="#fff";ctx.fillRect(0,0,384,700);ctx.fillStyle="#000";ctx.font="bold 18px monospace";let y=22;
  ctx.fillText((localStorage.getItem('tienda_nombre')||'TIENDA PATIA').substring(0,28),10,y); y+=20; ctx.font="12px monospace";
  ctx.fillText("Tel: "+(localStorage.getItem('tienda_tel')||''),10,y); y+=18; ctx.fillText("Fecha: "+new Date().toLocaleString('es-CO'),10,y); y+=18;
  ctx.fillText("Metodo: "+metodo.toUpperCase()+" "+cli,10,y); y+=18; ctx.fillText("-------------------------------",10,y); y+=16;
  carrito.forEach(p=>{y+=16; ctx.fillText(p.nombre.substring(0,20).padEnd(20)+" "+fmt(p.precio_final).padStart(10),10,y);});
  y+=22; ctx.font="bold 16px monospace"; ctx.fillText($('total').innerText,10,y);
  $('img-factura').src=canvas.toDataURL('image/png'); $('bloque-factura').style.display='block';
  ventas.push({total:carrito.reduce((s,p)=>s+Number(p.precio_final),0),fecha:Date.now(),productos:JSON.parse(JSON.stringify(carrito)),metodo}); localStorage.setItem('pos_ventas',JSON.stringify(ventas)); carrito=[]; renderCarrito(); renderBalance();
  // descontar stock
  productos.forEach(prod=>{let vend=ventas[ventas.length-1].productos.filter(p=>p.codigo==prod.codigo).length; prod.stock-=vend;}); localStorage.setItem('pos_prod',JSON.stringify(productos));
}
function compartirWhatsapp(){ $('canvas-factura').toBlob(b=>{const file=new File([b],"factura.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[file]})) navigator.share({files:[file],title:"Factura"}); else {let a=document.createElement('a');a.href=$('img-factura').src;a.download='factura.png';a.click(); window.open("https://wa.me/?text=Te envio tu factura");}});}
function imprimirImagen(){ let w=window.open(''); w.document.write('<img src="'+$('img-factura').src+'" style="width:384px" onload="window.print();window.close()">'); }
$('cliente-cobro').addEventListener('input',e=>{let t=e.target.value.toLowerCase(); let f=fiados.find(x=>x.nombre.toLowerCase().includes(t)||x.codigo.toLowerCase()==t); $('preview-cliente').innerText=f?`Encontrado: ${f.nombre} debe ${fmt(f.deuda)}`:'';});

// BALANCE
function guardarCfg(){ localStorage.setItem('tienda_nombre',$('cfg-nombre').value); localStorage.setItem('tienda_tel',$('cfg-tel').value); alert("Guardado"); }
function renderBalance(){ let mes=ventas.filter(v=>v.fecha>Date.now()-30*24*3600*1000); let tot=mes.reduce((s,v)=>s+v.total,0); $('balance-mes').innerHTML="Ventas 30 días: <b>"+fmt(tot)+"</b><br>Tickets: "+mes.length; let c={}; ventas.forEach(v=>v.productos.forEach(p=>c[p.nombre]=(c[p.nombre]||0)+1)); let top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3); $('top3').innerHTML=top.length? top.map(t=>`${t[0]}: ${t[1]} vendidos`).join('<br>'):'Sin ventas'; }
function cuadreCaja(){ let hoy=ventas.filter(v=>new Date(v.fecha).toDateString()==new Date().toDateString()); let t=hoy.reduce((s,v)=>s+v.total,0); alert("CUADRE HOY\nTotal: "+fmt(t)+"\nVentas: "+hoy.length); }
$('cfg-nombre').value=localStorage.getItem('tienda_nombre')||''; $('cfg-tel').value=localStorage.getItem('tienda_tel')||'';
renderInv();renderFiado();renderBalance();
</script>
</body>
</html>
